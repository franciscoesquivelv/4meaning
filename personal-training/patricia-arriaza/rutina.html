    }
    html { scroll-behavior: smooth; }
    body { background: var(--black); color: var(--white); font-family: var(--font-body); font-size: 15px; line-height: 1.6; overflow-x: hidden; }

    /* ── PAGE TRANSITION ── */

    .pnav-left { display: flex; align-items: center; gap: 16px; }
    .pnav-logo { height: 24px; width: auto; }
    .pnav-divider { width: 1px; height: 16px; background: var(--border); }
    .pnav-label { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    .pnav-right { display: flex; align-items: center; gap: 12px; }
    .pnav-user { display: flex; align-items: center; gap: 8px; }
    .pnav-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--orange); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-size: 11px; font-weight: 900; color: var(--white); }
    .pnav-name { font-size: 13px; font-weight: 600; }
    .pnav-badge { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); border-radius: 100px; padding: 4px 10px; }
    .pnav-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }

    /* ── LAYOUT ── */

    /* ── SIDEBAR ── */
    .portal-sidebar { border-right: 1px solid var(--border); padding: 28px 18px; background: var(--dark); display: flex; flex-direction: column; gap: 24px; position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; }
    .sb-profile { display: flex; flex-direction: column; align-items: center; text-align: center; padding-bottom: 22px; border-bottom: 1px solid var(--border); }

    .sb-prog-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .sb-prog-fill { height: 100%; background: var(--orange); border-radius: 2px; width: 37.5%; }
    .sb-section-title { font-size: 9px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

    .sb-nav-item:hover { background: var(--surface); color: var(--white); }

    .sb-routine-item:hover { background: var(--surface); color: var(--white); }

    .portal-main { padding: 40px 48px 80px; display: flex; flex-direction: column; gap: 32px; }
    .sec-label { display: inline-flex; align-items: center; gap: 9px; font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--orange); margin-bottom: 14px; }
    .sec-label::before { content: ''; display: block; width: 16px; height: 2px; background: var(--orange); }

    /* Back link */
    .back-link { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color .15s; }
    .back-link:hover { color: var(--white); }
    .back-link svg { transition: transform .2s; }

    .routine-header { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px 36px; display: flex; gap: 28px; align-items: flex-start; background-image: radial-gradient(ellipse at 95% 40%, rgba(255,77,0,.06), transparent 60%); }
    .rh-icon { width: 64px; height: 64px; border-radius: 12px; background: rgba(255,77,0,.12); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-size: 16px; font-weight: 900; color: var(--orange); letter-spacing: .04em; flex-shrink: 0; }
    .rh-body { flex: 1; min-width: 0; }
    .rh-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--orange); margin-bottom: 10px; }
    .rh-name { font-family: var(--font-head); font-size: clamp(40px, 5vw, 64px); font-weight: 900; text-transform: uppercase; line-height: .88; letter-spacing: -.02em; margin-bottom: 12px; }
    .rh-meta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
    .rh-meta-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-light); }
    .rh-meta-item svg { color: var(--muted); flex-shrink: 0; }
    .rh-desc { font-size: 14px; color: rgba(255,255,255,.65); line-height: 1.65; }

    /* ── EXERCISE TABLE ── */
    .exercise-section { display: flex; flex-direction: column; gap: 0; }
    .exercise-table { width: 100%; border-collapse: collapse; }
    .et-head { border-bottom: 1px solid var(--border); }
    .et-head th { padding: 10px 14px; text-align: left; font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .et-head th:first-child { width: 36px; text-align: center; }
    .et-head th.num-col { text-align: center; }
    .et-row { border-bottom: 1px solid rgba(39,39,39,.5); transition: background .15s; }
    .et-row:last-child { border-bottom: none; }
    .et-row:hover { background: rgba(255,255,255,.02); }
    .et-row td { padding: 16px 14px; vertical-align: top; }
    .et-num { text-align: center; font-family: var(--font-head); font-size: 17px; font-weight: 900; color: var(--muted); line-height: 1; padding-top: 18px; }
    .et-name { font-size: 14px; font-weight: 600; color: var(--white); line-height: 1.35; margin-bottom: 5px; }
    .et-note { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .et-sets, .et-reps, .et-rest { font-family: var(--font-head); font-size: 18px; font-weight: 700; color: var(--white); white-space: nowrap; }
    .et-rest { color: var(--muted-light); }
    .et-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: 3px 7px; white-space: nowrap; }
    .tag.ok { background: rgba(34,197,94,.1); color: var(--green); border: 1px solid rgba(34,197,94,.2); }
    .tag.care { background: rgba(245,158,11,.1); color: var(--amber); border: 1px solid rgba(245,158,11,.2); }
    .tag.info { background: rgba(255,255,255,.05); color: var(--muted-light); border: 1px solid var(--border); }

    /* Oscar note */
    .oscar-note { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--orange); border-radius: 10px; padding: 24px 28px; display: flex; gap: 18px; align-items: flex-start; }
    .on-badge { width: 38px; height: 38px; border-radius: 50%; background: var(--black); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-size: 12px; font-weight: 900; color: var(--orange); flex-shrink: 0; }
    .on-from { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--orange); margin-bottom: 9px; }
    .on-text { font-size: 14px; color: rgba(255,255,255,.8); line-height: 1.75; }
    .on-text strong { color: var(--white); }

    /* Prev / Next navigation */
    .routine-nav { display: flex; gap: 10px; }
    .rnav-btn { flex: 1; display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 16px 20px; text-decoration: none; transition: border-color .2s, background .2s; }
    .rnav-btn:hover { border-color: rgba(255,77,0,.3); background: rgba(255,77,0,.03); }
    .rnav-btn.next { justify-content: flex-end; text-align: right; flex-direction: row-reverse; }
    .rnav-icon { width: 34px; height: 34px; border-radius: 7px; background: rgba(255,255,255,.04); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-size: 9px; font-weight: 900; color: var(--muted); flex-shrink: 0; }
    .rnav-label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
    .rnav-name { font-family: var(--font-head); font-size: 17px; font-weight: 900; text-transform: uppercase; color: var(--white); line-height: 1; }

    @media (max-width: 960px) { .portal-body { grid-template-columns: 1fr; } .portal-sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; } }
    @media (max-width: 760px) { .portal-main { padding: 28px 20px 60px; } .routine-header { flex-direction: column; gap: 16px; padding: 24px 22px; } .rh-icon { width: 48px; height: 48px; font-size: 13px; } .et-head th:nth-child(4), .et-row td:nth-child(4) { display: none; } }
    @media (max-width: 500px) { .pnav-name, .pnav-badge { display: none; } .routine-nav { flex-direction: column; } }
  </style>
</head>

const pt = document.getElementById('page-transition');

document.addEventListener('click', e => {
  const link = e.target.closest('a[href]');
  if (!link) return;
  const href = link.getAttribute('href');
  if (!href || href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto') || link.target === '_blank') return;

  pt.classList.remove('hidden');
  setTimeout(() => { window.location.href = href; }, 420);
});
