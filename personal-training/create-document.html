<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Create Document — OE Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="./imagenes/logos/Artboard 1 copy 32.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="./imagenes/logos/Artboard 1 copy 22.png" media="(prefers-color-scheme: light)">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #FF4D00;
      --black: #080808;
      --surface: #181818;
      --surface2: #222222;
      --border: #2c2c2c;
      --white: #ffffff;
      --muted: #666666;
      --font-head: 'Barlow Condensed', sans-serif;
      --font-body: 'Barlow', sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .oe-badge {
      width: 34px; height: 34px;
      background: var(--orange);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head);
      font-size: 13px; font-weight: 900;
      color: #000; flex-shrink: 0;
    }
    .page-header h1 {
      font-family: var(--font-head);
      font-size: 19px; font-weight: 800;
      letter-spacing: .07em; text-transform: uppercase;
    }
    .page-header-hint {
      margin-left: auto;
      font-size: 12px; color: var(--muted);
    }

    /* ── LAYOUT ── */
    .main { max-width: 900px; margin: 0 auto; padding: 36px 24px 100px; }

    /* ── CARD ── */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 26px 28px;
      margin-bottom: 18px;
    }
    .form-card-title {
      font-family: var(--font-head);
      font-size: 10px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    /* ── GRID ── */
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .g4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }
    .mt { margin-top: 14px; }
    .span2 { grid-column: span 2; }

    /* ── FIELD ── */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 10px; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted);
    }
    .field label .req { color: var(--orange); }
    .field input,
    .field select,
    .field textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--white);
      font-family: var(--font-body);
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus { border-color: var(--orange); }
    .field input::placeholder,
    .field textarea::placeholder { color: #444; }
    .field select option { background: #222; }
    .field textarea { resize: vertical; min-height: 72px; }
    .field input.error,
    .field select.error { border-color: #e04040; }

    /* ── AGE CHECKBOXES ── */
    .check-row { display: flex; gap: 16px; flex-wrap: wrap; padding-top: 5px; }
    .check-item { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
    .check-item input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--orange); cursor: pointer; }
    .check-item span { font-size: 13px; }

    /* ── EXERCISE LIST ── */
    .ex-list { min-height: 48px; margin-bottom: 12px; }
    .ex-empty {
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .ex-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 6px;
      transition: border-color .2s;
    }
    .ex-item:hover { border-color: #3a3a3a; }
    .ex-num {
      font-family: var(--font-head);
      font-size: 13px; font-weight: 700;
      color: var(--orange);
      min-width: 22px;
      text-align: center;
      flex-shrink: 0;
    }
    .ex-info { flex: 1; min-width: 0; }
    .ex-info-name {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ex-info-meta {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ex-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .ex-btn {
      background: none; border: none;
      border-radius: 4px;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #555;
      font-size: 13px;
      transition: color .2s, background .2s;
    }
    .ex-btn:hover { color: var(--white); background: #333; }
    .ex-btn.del:hover { color: #e04040; background: rgba(224,64,64,.12); }
    .ex-btn svg { width: 14px; height: 14px; pointer-events: none; }

    .btn-add-ex {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: none;
      border: 1px dashed var(--border);
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 13px;
      padding: 9px 18px;
      transition: border-color .2s, color .2s;
    }
    .btn-add-ex:hover { border-color: var(--orange); color: var(--orange); }

    /* ── MODAL ── */
    #modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.88);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity .22s ease;
    }
    #modal-overlay.open { opacity: 1; pointer-events: all; }
    #modal {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      width: 100%; max-width: 480px;
      padding: 28px;
      transform: translateY(18px) scale(.98);
      transition: transform .22s ease;
    }
    #modal-overlay.open #modal { transform: translateY(0) scale(1); }
    .modal-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 22px;
    }
    .modal-header .oe-badge { width: 28px; height: 28px; font-size: 10px; }
    .modal-title {
      font-family: var(--font-head);
      font-size: 17px; font-weight: 800;
      letter-spacing: .05em; text-transform: uppercase;
    }
    .modal-close {
      margin-left: auto;
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: 20px; line-height: 1;
      padding: 4px;
      transition: color .2s;
    }
    .modal-close:hover { color: var(--white); }
    .modal-fields { display: flex; flex-direction: column; gap: 14px; }
    .modal-fields .g2 { gap: 12px; }
    .modal-actions {
      display: flex; gap: 10px; justify-content: flex-end;
      margin-top: 24px;
    }
    .modal-cancel {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 14px;
      padding: 10px 22px;
      transition: border-color .2s, color .2s;
    }
    .modal-cancel:hover { border-color: #555; color: var(--white); }
    .modal-save {
      background: var(--orange);
      border: none;
      border-radius: 4px;
      color: var(--white);
      cursor: pointer;
      font-family: var(--font-head);
      font-size: 15px; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase;
      padding: 10px 32px;
      transition: background .2s;
    }
    .modal-save:hover { background: #cc3d00; }

    /* ── BOTTOM ACTIONS ── */
    .page-actions {
      display: flex; align-items: center;
      justify-content: space-between;
      gap: 16px; margin-top: 28px;
    }
    .btn-reset {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 13px;
      padding: 11px 24px;
      transition: border-color .2s, color .2s;
    }
    .btn-reset:hover { border-color: #555; color: var(--white); }
    .btn-generate {
      background: var(--orange);
      border: none; border-radius: 4px;
      color: var(--white); cursor: pointer;
      font-family: var(--font-head);
      font-size: 17px; font-weight: 800;
      letter-spacing: .1em; text-transform: uppercase;
      padding: 15px 48px;
      transition: background .2s, transform .15s;
    }
    .btn-generate:hover { background: #cc3d00; transform: translateY(-1px); }
    .btn-generate:active { transform: none; }
    .btn-generate:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: #162416;
      border: 1px solid #2a4d2a;
      border-radius: 6px;
      color: #6fcf6f;
      font-size: 13px; font-weight: 500;
      padding: 11px 22px;
      transition: transform .32s ease;
      z-index: 999; white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── RESPONSIVE ── */
    @media (max-width: 620px) {
      .g2, .g3, .g4 { grid-template-columns: 1fr; }
      .span2 { grid-column: span 1; }
      .form-card { padding: 18px 16px; }
      .page-header-hint { display: none; }
      #modal { padding: 22px 18px; }
    }
  </style>
</head>
<body>

<!-- PAGE HEADER -->
<header class="page-header">
  <img src="./imagenes/logos/Artboard 1 copy 32.png" alt="OE" style="height:32px;width:auto;flex-shrink:0">
  <h1>Create Routine Document</h1>
  <span class="page-header-hint">Internal — not linked publicly</span>
</header>

<main class="main">

  <!-- 01 PROGRAM IDENTITY -->
  <div class="form-card">
    <div class="form-card-title">01 — Program Identity</div>
    <div class="g2">
      <div class="field span2">
        <label>Program Name <span class="req">*</span></label>
        <input type="text" id="prog-title" placeholder="e.g. Push Foundation, Iron Circuit, Morning Activation…">
      </div>
    </div>
    <div class="g4 mt">
      <div class="field">
        <label>Type <span class="req">*</span></label>
        <select id="prog-type">
          <option value="Basic">Basic</option>
          <option value="Pro">Pro</option>
        </select>
      </div>
      <div class="field">
        <label>Duration <span class="req">*</span></label>
        <input type="text" id="prog-duration" placeholder="e.g. 25 min">
      </div>
      <div class="field">
        <label>Category</label>
        <select id="prog-category">
          <option value="Strength">Strength</option>
          <option value="HIIT">HIIT</option>
          <option value="Mobility">Mobility</option>
          <option value="Activation">Activation</option>
        </select>
      </div>
      <div class="field">
        <label>Setting</label>
        <select id="prog-setting">
          <option value="Gym">Gym</option>
          <option value="Home">Home</option>
          <option value="Outdoor">Outdoor</option>
          <option value="Hotel">Hotel</option>
          <option value="Beach">Beach</option>
        </select>
      </div>
    </div>
    <div class="g2 mt">
      <div class="field">
        <label>Target Gender</label>
        <select id="prog-gender">
          <option value="Men &amp; Women">Men &amp; Women</option>
          <option value="Men">Men</option>
          <option value="Women">Women</option>
        </select>
      </div>
      <div class="field">
        <label>Age Range</label>
        <div class="check-row">
          <label class="check-item"><input type="checkbox" id="age-20" value="20–35" checked><span>20–35</span></label>
          <label class="check-item"><input type="checkbox" id="age-35" value="35–50"><span>35–50</span></label>
          <label class="check-item"><input type="checkbox" id="age-50" value="50+"><span>50+</span></label>
        </div>
      </div>
    </div>
  </div>

  <!-- 02 DESCRIPTION -->
  <div class="form-card">
    <div class="form-card-title">02 — Description &amp; Highlights</div>
    <div class="field">
      <label>Program Description <span class="req">*</span></label>
      <textarea id="prog-desc" rows="3" placeholder="What is this program about? Who is it for? What will the client experience? (2–3 sentences)"></textarea>
    </div>
    <div class="g3 mt">
      <div class="field">
        <label>Key Benefit 1</label>
        <input type="text" id="h1" placeholder="e.g. Build foundational pushing strength">
      </div>
      <div class="field">
        <label>Key Benefit 2</label>
        <input type="text" id="h2" placeholder="e.g. Improve shoulder stability">
      </div>
      <div class="field">
        <label>Key Benefit 3</label>
        <input type="text" id="h3" placeholder="e.g. Progressive overload built in">
      </div>
    </div>
  </div>

  <!-- 03 WARM-UP -->
  <div class="form-card">
    <div class="form-card-title">03 — Warm-Up</div>
    <div class="ex-list" id="list-warmup"></div>
    <button class="btn-add-ex" onclick="openModal('warmup')">
      <svg viewBox="0 0 16 16" fill="currentColor" style="width:14px;height:14px"><path d="M8 2a.75.75 0 01.75.75v4.5h4.5a.75.75 0 010 1.5h-4.5v4.5a.75.75 0 01-1.5 0v-4.5h-4.5a.75.75 0 010-1.5h4.5v-4.5A.75.75 0 018 2z"/></svg>
      Add exercise
    </button>
  </div>

  <!-- 04 MAIN WORKOUT -->
  <div class="form-card">
    <div class="form-card-title">04 — Main Workout</div>
    <div class="ex-list" id="list-main"></div>
    <button class="btn-add-ex" onclick="openModal('main')">
      <svg viewBox="0 0 16 16" fill="currentColor" style="width:14px;height:14px"><path d="M8 2a.75.75 0 01.75.75v4.5h4.5a.75.75 0 010 1.5h-4.5v4.5a.75.75 0 01-1.5 0v-4.5h-4.5a.75.75 0 010-1.5h4.5v-4.5A.75.75 0 018 2z"/></svg>
      Add exercise
    </button>
  </div>

  <!-- 05 COOL-DOWN -->
  <div class="form-card">
    <div class="form-card-title">05 — Cool-Down</div>
    <div class="ex-list" id="list-cooldown"></div>
    <button class="btn-add-ex" onclick="openModal('cooldown')">
      <svg viewBox="0 0 16 16" fill="currentColor" style="width:14px;height:14px"><path d="M8 2a.75.75 0 01.75.75v4.5h4.5a.75.75 0 010 1.5h-4.5v4.5a.75.75 0 01-1.5 0v-4.5h-4.5a.75.75 0 010-1.5h4.5v-4.5A.75.75 0 018 2z"/></svg>
      Add exercise
    </button>
  </div>

  <!-- 06 COACH'S NOTE -->
  <div class="form-card">
    <div class="form-card-title">06 — Coach's Note <span style="color:var(--muted);font-weight:400;font-size:11px;letter-spacing:0;text-transform:none">(optional)</span></div>
    <div class="field">
      <textarea id="coach-note" rows="3" placeholder="A personal message, motivation, or context for the client doing this program…"></textarea>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="page-actions">
    <button class="btn-reset" onclick="resetForm()">Clear Form</button>
    <button class="btn-generate" id="gen-btn" onclick="generatePDF()">Generate PDF →</button>
  </div>

</main>

<!-- ── MODAL ── -->
<div id="modal-overlay" onclick="handleOverlayClick(event)">
  <div id="modal">
    <div class="modal-header">
      <div class="oe-badge">OE</div>
      <span class="modal-title" id="modal-title">Add Exercise</span>
      <button class="modal-close" onclick="closeModal()" title="Close">✕</button>
    </div>
    <div class="modal-fields" id="modal-fields">
      <!-- Injected dynamically -->
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-save" id="modal-save-btn" onclick="saveExercise()">Save Exercise</button>
    </div>
  </div>
</div>

<div id="toast">PDF downloaded successfully.</div>

<script>
// ── DATA STORE ──────────────────────────────────────────────────────────────

const data = {
  warmup:   [],   // {name, reps, notes}
  main:     [],   // {name, sets, reps, rest, tip}
  cooldown: [],   // {name, duration, notes}
};

// ── SECTION CONFIG ──────────────────────────────────────────────────────────

const SECTIONS = {
  warmup: {
    label: 'Warm-Up',
    fields: [
      { id: 'name',  label: 'Exercise Name', placeholder: 'e.g. Hip circles, Arm swings…', required: true, span: 2 },
      { id: 'reps',  label: 'Reps / Duration', placeholder: 'e.g. 30 sec, 10 reps' },
      { id: 'notes', label: 'Notes (optional)', placeholder: 'e.g. Full range of motion' },
    ],
    meta: (ex) => [ex.reps, ex.notes].filter(Boolean).join('  ·  '),
  },
  main: {
    label: 'Main Workout',
    fields: [
      { id: 'name', label: 'Exercise Name', placeholder: 'e.g. Barbell Squat, Push-Up…', required: true, span: 2 },
      { id: 'sets', label: 'Sets',  placeholder: 'e.g. 4' },
      { id: 'reps', label: 'Reps',  placeholder: 'e.g. 10–12' },
      { id: 'rest', label: 'Rest',  placeholder: 'e.g. 60 sec' },
      { id: 'tip',  label: 'Form Tip (optional)', placeholder: 'e.g. Keep core tight, neutral spine', span: 2 },
    ],
    meta: (ex) => {
      const parts = [];
      if (ex.sets && ex.reps) parts.push(ex.sets + ' × ' + ex.reps);
      else if (ex.sets) parts.push(ex.sets + ' sets');
      else if (ex.reps) parts.push(ex.reps + ' reps');
      if (ex.rest) parts.push(ex.rest + ' rest');
      if (ex.tip)  parts.push(ex.tip);
      return parts.join('  ·  ');
    },
  },
  cooldown: {
    label: 'Cool-Down',
    fields: [
      { id: 'name',     label: 'Exercise Name', placeholder: 'e.g. Standing quad stretch…', required: true, span: 2 },
      { id: 'duration', label: 'Duration', placeholder: 'e.g. 45 sec' },
      { id: 'notes',    label: 'Notes (optional)', placeholder: 'e.g. Hold and breathe deeply' },
    ],
    meta: (ex) => [ex.duration, ex.notes].filter(Boolean).join('  ·  '),
  },
};

// ── RENDER EXERCISE LIST ────────────────────────────────────────────────────

function renderList(section) {
  const list = document.getElementById('list-' + section);
  const items = data[section];

  if (!items.length) {
    list.innerHTML = '<div class="ex-empty">No exercises yet — press Add exercise below.</div>';
    return;
  }

  list.innerHTML = items.map((ex, i) => `
    <div class="ex-item">
      <span class="ex-num">${String(i + 1).padStart(2, '0')}</span>
      <div class="ex-info">
        <div class="ex-info-name">${escHtml(ex.name)}</div>
        <div class="ex-info-meta">${escHtml(SECTIONS[section].meta(ex)) || '&nbsp;'}</div>
      </div>
      <div class="ex-actions">
        ${i > 0 ? `<button class="ex-btn" onclick="moveEx('${section}',${i},-1)" title="Move up">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 3.293L3.854 7.44a.75.75 0 11-1.06-1.061l4.75-4.75a.75.75 0 011.06 0l4.75 4.75a.75.75 0 11-1.06 1.06L8 3.294z"/><path d="M8 8.293L3.854 12.44a.75.75 0 01-1.06-1.061l4.75-4.75a.75.75 0 011.06 0l4.75 4.75a.75.75 0 01-1.06 1.06L8 8.294z" opacity=".35"/></svg>
        </button>` : '<span style="width:30px"></span>'}
        ${i < items.length - 1 ? `<button class="ex-btn" onclick="moveEx('${section}',${i},1)" title="Move down">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 12.707l4.146-4.147a.75.75 0 111.06 1.061l-4.75 4.75a.75.75 0 01-1.06 0l-4.75-4.75a.75.75 0 111.06-1.06L8 12.706z"/><path d="M8 7.707l4.146-4.147a.75.75 0 01 1.06 1.061l-4.75 4.75a.75.75 0 01-1.06 0l-4.75-4.75a.75.75 0 01 1.06-1.06L8 7.706z" opacity=".35"/></svg>
        </button>` : '<span style="width:30px"></span>'}
        <button class="ex-btn" onclick="editEx('${section}',${i})" title="Edit">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.013 1.427a1.75 1.75 0 012.474 0l1.086 1.086a1.75 1.75 0 010 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 01-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61zm1.414 1.06a.25.25 0 00-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 000-.354l-1.086-1.086zM11.189 6.25L9.75 4.81 3.23 11.329c-.026.026-.052.073-.063.115l-.572 2.003 2.003-.572a.25.25 0 00.114-.063L11.19 6.25z"/></svg>
        </button>
        <button class="ex-btn del" onclick="deleteEx('${section}',${i})" title="Delete">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M6.5 1.75a.25.25 0 01.25-.25h2.5a.25.25 0 01.25.25V3h-3V1.75zm4.5 0V3h2.25a.75.75 0 010 1.5H2.75a.75.75 0 010-1.5H5V1.75C5 .784 5.784 0 6.75 0h2.5C10.216 0 11 .784 11 1.75zM4.496 6.559a.75.75 0 10-1.492.149l.66 6.6A1.75 1.75 0 005.41 14.75h5.178a1.75 1.75 0 001.746-1.442l.66-6.6a.75.75 0 00-1.492-.149l-.66 6.6a.25.25 0 01-.249.206H5.408a.25.25 0 01-.25-.206l-.66-6.6z"/></svg>
        </button>
      </div>
    </div>
  `).join('');
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── MODAL ───────────────────────────────────────────────────────────────────

let _modalSection = null;
let _editIndex    = null;

function openModal(section, editIdx = null) {
  _modalSection = section;
  _editIndex    = editIdx;
  const cfg     = SECTIONS[section];
  const editing = editIdx !== null;
  const existing = editing ? data[section][editIdx] : {};

  document.getElementById('modal-title').textContent =
    (editing ? 'Edit Exercise' : 'Add Exercise') + ' — ' + cfg.label;
  document.getElementById('modal-save-btn').textContent =
    editing ? 'Save Changes' : 'Add Exercise';

  // Build field HTML
  const fieldsEl = document.getElementById('modal-fields');
  fieldsEl.innerHTML = cfg.fields.map(f => `
    <div class="field" style="${f.span ? 'grid-column:span ' + f.span : ''}">
      <label>${f.label}${f.required ? ' <span class="req">*</span>' : ''}</label>
      <input type="text"
             id="mf-${f.id}"
             placeholder="${f.placeholder}"
             value="${escHtml(existing[f.id] || '')}"
             autocomplete="off">
    </div>
  `).join('');

  // Wrap in 2-col grid
  fieldsEl.style.display = 'grid';
  fieldsEl.style.gridTemplateColumns = '1fr 1fr';
  fieldsEl.style.gap = '12px';

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  // Focus first field
  setTimeout(() => {
    const first = document.getElementById('mf-name');
    if (first) first.focus();
  }, 80);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  _modalSection = null;
  _editIndex    = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('modal-overlay').classList.contains('open')) {
    e.preventDefault();
    saveExercise();
  }
});

function saveExercise() {
  if (!_modalSection) return;
  const cfg  = SECTIONS[_modalSection];
  const nameEl = document.getElementById('mf-name');
  nameEl.classList.remove('error');
  if (!nameEl.value.trim()) { nameEl.classList.add('error'); nameEl.focus(); return; }

  const obj = {};
  cfg.fields.forEach(f => {
    const el = document.getElementById('mf-' + f.id);
    if (el) obj[f.id] = el.value.trim();
  });

  if (_editIndex !== null) {
    data[_modalSection][_editIndex] = obj;
  } else {
    data[_modalSection].push(obj);
  }

  renderList(_modalSection);
  closeModal();
}

// ── EXERCISE ACTIONS ────────────────────────────────────────────────────────

function moveEx(section, idx, dir) {
  const arr   = data[section];
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= arr.length) return;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  renderList(section);
}

function editEx(section, idx) {
  openModal(section, idx);
}

function deleteEx(section, idx) {
  data[section].splice(idx, 1);
  renderList(section);
}

// ── FORM RESET ──────────────────────────────────────────────────────────────

function resetForm() {
  if (!confirm('Clear all form data?')) return;
  ['prog-title','prog-desc','prog-duration','h1','h2','h3','coach-note']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('age-20').checked = true;
  document.getElementById('age-35').checked = false;
  document.getElementById('age-50').checked = false;
  data.warmup = []; data.main = []; data.cooldown = [];
  ['warmup','main','cooldown'].forEach(s => renderList(s));
}

// ── TOAST ────────────────────────────────────────────────────────────────────

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

// ── INIT ─────────────────────────────────────────────────────────────────────

let _logoBase64 = null;

async function preloadLogo() {
  try {
    const resp = await fetch('./imagenes/logos/Artboard 1 copy 32.png');
    const blob = await resp.blob();
    await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => { _logoBase64 = reader.result; resolve(); };
      reader.readAsDataURL(blob);
    });
  } catch (e) {
    console.warn('Logo preload failed:', e);
  }
}

['warmup','main','cooldown'].forEach(s => renderList(s));
preloadLogo();

// ── PDF GENERATION ───────────────────────────────────────────────────────────

async function generatePDF() {
  const titleEl = document.getElementById('prog-title');
  const descEl  = document.getElementById('prog-desc');
  const durEl   = document.getElementById('prog-duration');
  let valid = true;
  [titleEl, descEl, durEl].forEach(el => {
    el.classList.remove('error');
    if (!el.value.trim()) { el.classList.add('error'); valid = false; }
  });
  if (!valid) { titleEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }

  const btn = document.getElementById('gen-btn');
  btn.disabled = true;
  btn.textContent = 'Generating…';
  await new Promise(r => setTimeout(r, 40));

  try {
    buildPDF();
    showToast('PDF downloaded successfully.');
  } catch (err) {
    console.error(err);
    showToast('Error — check console.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate PDF →';
  }
}

function buildPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'letter' });
  const W = 215.9, H = 279.4, M = 14;

  // Colors (arrays for setFillColor / setTextColor)
  const BK = [8,   8,   8];
  const OR = [255, 77,  0];
  const WH = [255, 255, 255];
  const DG = [22,  22,  22];
  const MU = [130, 130, 130];

  // Collect form values
  const title    = document.getElementById('prog-title').value.trim();
  const type     = document.getElementById('prog-type').value;
  const duration = document.getElementById('prog-duration').value.trim();
  const category = document.getElementById('prog-category').value;
  const setting  = document.getElementById('prog-setting').value;
  const gender   = document.getElementById('prog-gender').value;
  const ages     = ['age-20','age-35','age-50']
    .filter(id => document.getElementById(id).checked)
    .map(id => document.getElementById(id).value);
  const desc   = document.getElementById('prog-desc').value.trim();
  const h1     = document.getElementById('h1').value.trim();
  const h2     = document.getElementById('h2').value.trim();
  const h3     = document.getElementById('h3').value.trim();
  const note   = document.getElementById('coach-note').value.trim();
  const highlights = [h1, h2, h3].filter(Boolean);

  // Convert exercise data → rows for autoTable
  const warmupRows   = data.warmup.map(e   => [e.name, e.reps || '', e.notes || '']);
  const mainRows     = data.main.map(e     => [e.name, e.sets || '', e.reps || '', e.rest || '', e.tip || '']);
  const cooldownRows = data.cooldown.map(e => [e.name, e.duration || '', e.notes || '']);

  let y = 0;

  // ─── PAGE 1 HEADER ───────────────────────────────────────────────────────
  const headerH = 52;
  doc.setFillColor(BK[0], BK[1], BK[2]);
  doc.rect(0, 0, W, headerH, 'F');
  doc.setFillColor(OR[0], OR[1], OR[2]);
  doc.rect(0, 0, 4, headerH, 'F');

  // OE logo
  if (_logoBase64) {
    doc.addImage(_logoBase64, 'PNG', M, 12, 22, 22);
  } else {
    doc.setFillColor(OR[0], OR[1], OR[2]);
    doc.roundedRect(M, 11, 22, 22, 1, 1, 'F');
    doc.setTextColor(0, 0, 0);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.text('OE', M + 11, 25, { align: 'center' });
  }

  // Program title
  doc.setTextColor(WH[0], WH[1], WH[2]);
  doc.setFont('helvetica', 'bold');
  const tSize = title.length > 30 ? 20 : (title.length > 20 ? 23 : 26);
  doc.setFontSize(tSize);
  doc.text(title.toUpperCase(), M + 28, 24);

  // Type badge
  const isBasic = type === 'Basic';
  doc.setFillColor(isBasic ? 55 : OR[0], isBasic ? 55 : OR[1], isBasic ? 55 : OR[2]);
  doc.roundedRect(M + 28, 28, 20, 6.5, 1, 1, 'F');
  if (isBasic) {
    doc.setTextColor(WH[0], WH[1], WH[2]);
  } else {
    doc.setTextColor(0, 0, 0);
  }
  doc.setFontSize(6.5);
  doc.setFont('helvetica', 'bold');
  doc.text(type.toUpperCase(), M + 38, 33, { align: 'center' });

  // Meta
  doc.setTextColor(MU[0], MU[1], MU[2]);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8.5);
  doc.text(duration + '  ·  ' + category + '  ·  ' + setting, M + 54, 33);

  // Target
  const ageStr = ages.length ? ages.join(', ') : 'All ages';
  doc.setFontSize(8.5);
  doc.text('For: ' + gender + '  ·  ' + ageStr, M + 28, 44);

  y = headerH + 12;

  // ─── DESCRIPTION ──────────────────────────────────────────────────────────
  if (desc) {
    doc.setTextColor(50, 50, 50);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    const lines = doc.splitTextToSize(desc, W - M * 2);
    doc.text(lines, M, y);
    y += lines.length * 5.2 + 8;
  }

  // ─── HIGHLIGHTS ───────────────────────────────────────────────────────────
  if (highlights.length) {
    const boxH = highlights.length * 9 + 14;
    doc.setFillColor(250, 247, 245);
    doc.roundedRect(M, y, W - M * 2, boxH, 2, 2, 'F');
    doc.setFillColor(OR[0], OR[1], OR[2]);
    doc.rect(M, y, 3, boxH, 'F');
    let hy = y + 10;
    highlights.forEach(h => {
      doc.setFillColor(OR[0], OR[1], OR[2]);
      doc.circle(M + 9, hy - 1, 1.5, 'F');
      doc.setTextColor(40, 40, 40);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9.5);
      doc.text(h, M + 14, hy);
      hy += 9;
    });
    y += boxH + 12;
  }

  // ─── EXERCISE SECTIONS ────────────────────────────────────────────────────
  const sectionDefs = [
    {
      label: 'WARM-UP',
      rows: warmupRows,
      head: [['Exercise', 'Reps / Duration', 'Notes']],
      colStyles: { 0: { cellWidth: 70, fontStyle: 'bold' }, 1: { cellWidth: 42 } },
    },
    {
      label: 'MAIN WORKOUT',
      rows: mainRows,
      head: [['Exercise', 'Sets', 'Reps', 'Rest', 'Form Tip']],
      colStyles: { 0: { cellWidth: 52, fontStyle: 'bold' }, 1: { cellWidth: 16 }, 2: { cellWidth: 22 }, 3: { cellWidth: 22 } },
    },
    {
      label: 'COOL-DOWN',
      rows: cooldownRows,
      head: [['Exercise', 'Duration', 'Notes']],
      colStyles: { 0: { cellWidth: 70, fontStyle: 'bold' }, 1: { cellWidth: 38 } },
    },
  ];

  sectionDefs.forEach(sec => {
    if (!sec.rows.length) return;
    if (y > 240) { doc.addPage(); y = 22; }

    // Section header bar
    doc.setFillColor(DG[0], DG[1], DG[2]);
    doc.rect(M, y, W - M * 2, 10, 'F');
    doc.setFillColor(OR[0], OR[1], OR[2]);
    doc.rect(M, y, 3, 10, 'F');
    doc.setTextColor(WH[0], WH[1], WH[2]);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8.5);
    doc.text(sec.label, M + 7, y + 7);
    y += 10;

    doc.autoTable({
      startY: y,
      margin: { left: M, right: M, top: 22, bottom: 18 },
      head: sec.head,
      body: sec.rows,
      theme: 'grid',
      headStyles: {
        fillColor: [18, 18, 18],
        textColor: [190, 190, 190],
        fontStyle: 'bold',
        fontSize: 8,
        cellPadding: { top: 5, bottom: 5, left: 6, right: 4 },
      },
      bodyStyles: {
        fontSize: 9,
        textColor: [35, 35, 35],
        cellPadding: { top: 6, bottom: 6, left: 6, right: 4 },
      },
      alternateRowStyles: { fillColor: [248, 248, 248] },
      styles: { lineColor: [215, 215, 215], lineWidth: 0.25, overflow: 'linebreak' },
      columnStyles: sec.colStyles,
      didDrawPage: (d) => {
        if (d.pageNumber > 1) pdfContinHeader(doc, title, W, M, BK, OR, WH, MU);
        pdfFooter(doc, W, H, M, BK, MU);
      },
    });

    y = doc.lastAutoTable.finalY + 10;
  });

  // ─── COACH'S NOTE ─────────────────────────────────────────────────────────
  if (note) {
    if (y > 238) { doc.addPage(); y = 22; }
    const noteLines = doc.splitTextToSize(note, W - M * 2 - 22);
    const boxH = noteLines.length * 5.5 + 24;
    doc.setFillColor(255, 245, 240);
    doc.roundedRect(M, y, W - M * 2, boxH, 2, 2, 'F');
    doc.setFillColor(OR[0], OR[1], OR[2]);
    doc.rect(M, y, 3, boxH, 'F');
    doc.setTextColor(OR[0], OR[1], OR[2]);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(7.5);
    doc.text("COACH'S NOTE", M + 8, y + 9);
    doc.setTextColor(60, 30, 10);
    doc.setFont('helvetica', 'italic');
    doc.setFontSize(9.5);
    doc.text(noteLines, M + 8, y + 17);
    y += boxH + 10;
  }

  // ─── FOOTER ON ALL PAGES ──────────────────────────────────────────────────
  const totalPages = doc.getNumberOfPages();
  for (let p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    if (p > 1) pdfContinHeader(doc, title, W, M, BK, OR, WH, MU);
    pdfFooter(doc, W, H, M, BK, MU);
    doc.setTextColor(MU[0], MU[1], MU[2]);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.5);
    doc.text(p + ' / ' + totalPages, W - M, H - 5, { align: 'right' });
  }

  const filename = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.pdf';
  doc.save(filename);
}

function pdfContinHeader(doc, title, W, M, BK, OR, WH, MU) {
  doc.setFillColor(BK[0], BK[1], BK[2]);
  doc.rect(0, 0, W, 14, 'F');
  doc.setFillColor(OR[0], OR[1], OR[2]);
  doc.rect(0, 0, 4, 14, 'F');
  doc.setTextColor(WH[0], WH[1], WH[2]);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7.5);
  doc.text(title.toUpperCase(), M, 10);
  if (_logoBase64) {
    doc.addImage(_logoBase64, 'PNG', W - M - 8, 3, 8, 8);
  } else {
    doc.setTextColor(OR[0], OR[1], OR[2]);
    doc.text('OE', W - M, 10, { align: 'right' });
  }
}

function pdfFooter(doc, W, H, M, BK, MU) {
  doc.setFillColor(BK[0], BK[1], BK[2]);
  doc.rect(0, H - 13, W, 13, 'F');
  doc.setTextColor(MU[0], MU[1], MU[2]);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7);
  doc.text('OSCAR ESQUIVEL  ·  PERSONAL TRAINING', M, H - 5);
  doc.text('4meaning.life/personal-training', W / 2, H - 5, { align: 'center' });
}
