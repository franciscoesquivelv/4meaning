<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Acuerdos — Trascendencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --surface2:  #1c1c1c;
      --border:    #272727;
      --border-hi: #3a3a3a;
      --text:      #f8f7f5;
      --muted:     #666666;
      --error:     #c0504a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .back-link {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .back-link:hover { color: var(--text); }
    .header-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      flex-shrink: 0;
    }
    .header-logo {
      height: 18px;
      width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.75;
    }
    .header-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-left: auto;
    }

    /* ── LAYOUT ── */
    .main { max-width: 640px; margin: 0 auto; padding: 36px 24px 120px; }

    /* ── TYPE TABS ── */
    .type-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 28px;
    }
    .tab {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      padding: 7px 14px;
      transition: all 0.15s;
      text-transform: uppercase;
    }
    .tab:hover { border-color: var(--border-hi); color: var(--text); }
    .tab.active {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg);
    }

    /* ── FORM SECTION ── */
    .form-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 12px;
    }
    .section-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .fields { display: flex; flex-direction: column; gap: 14px; }
    .fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field label .req { color: var(--text); opacity: 0.5; margin-left: 2px; }
    .field input,
    .field select,
    .field textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 400;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
      -webkit-appearance: none;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus { border-color: var(--border-hi); }
    .field input.invalid,
    .field select.invalid { border-color: var(--error); }
    .field input::placeholder,
    .field textarea::placeholder { color: #3a3a3a; }
    .field select option { background: #141414; }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-hint {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* cost preview */
    .cost-preview {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .cost-preview-label { font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: 0.06em; }
    .cost-preview-value { font-size: 15px; font-weight: 700; color: var(--text); }

    /* ── GENERATE BTN ── */
    .btn-generate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--text);
      border: none;
      border-radius: 6px;
      color: var(--bg);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 14px 28px;
      width: 100%;
      transition: opacity 0.15s;
      margin-top: 4px;
    }
    .btn-generate:hover { opacity: 0.88; }
    .btn-generate:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-generate svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 6px;
      padding: 11px 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(192,80,74,0.5); color: #e07070; }
  </style>
</head>
<body>

<header class="page-header">
  <a href="../" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Hub
  </a>
  <div class="header-sep"></div>
  <img class="header-logo" src="../../logos/logotrascendencia.png" alt="Trascendencia">
  <span class="header-title">Acuerdos de Confidencialidad</span>
</header>

<main class="main">

  <div class="type-tabs" id="type-tabs">
    <button class="tab active" data-type="evento">Evento</button>
    <button class="tab" data-type="video">Equipo de Video</button>
    <button class="tab" data-type="storybook">Storybook</button>
    <button class="tab" data-type="staff">Staff</button>
    <button class="tab" data-type="participante">Participante</button>
    <button class="tab" data-type="fotografo">Fotógrafo</button>
  </div>

  <div id="form-container"></div>

  <button class="btn-generate" id="btn-generate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Generar PDF
  </button>

</main>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────
// AGREEMENT DEFINITIONS
// ─────────────────────────────────────────────
const TYPES = {
  evento: {
    label: 'Evento Trascendencia',
    sections: [
      {
        title: 'Datos del Evento',
        fields: [
          { id: 'capitulo',    label: 'Capítulo YPO',               type: 'text',   req: true, placeholder: 'Ej: YPO México Norte' },
          { id: 'contacto',   label: 'Representante del capítulo',  type: 'text',   req: true, placeholder: 'Nombre completo' },
          { id: 'ciudad',     label: 'Ciudad del evento',           type: 'text',   req: true, placeholder: 'Ej: Antigua Guatemala' },
          { id: 'fecha_evento',label: 'Fecha del evento',           type: 'text',   req: true, placeholder: 'Ej: 14–16 de marzo, 2025' },
          { id: 'n_parejas',  label: 'Número de parejas',           type: 'number', req: true, min: 8, max: 24, placeholder: '8' },
          { id: 'fecha_firma',label: 'Fecha de este acuerdo',       type: 'date',   req: true },
        ]
      }
    ]
  },
  video: {
    label: 'Equipo de Video',
    sections: [
      {
        title: 'Datos del Proveedor',
        fields: [
          { id: 'empresa',    label: 'Empresa / Responsable', type: 'text', req: true, placeholder: 'Ej: Maleta Films' },
          { id: 'evento',     label: 'Evento',                type: 'text', req: true, placeholder: 'Ej: YPO México Norte — Marzo 2025' },
          { id: 'fecha_firma',label: 'Fecha de este acuerdo', type: 'date', req: true },
        ]
      }
    ]
  },
  storybook: {
    label: 'Storybook',
    sections: [
      {
        title: 'Datos del Encargo',
        fields: [
          { id: 'familia',     label: 'Familia',              type: 'text',   req: true, placeholder: 'Ej: Familia Rodríguez Sánchez' },
          { id: 'evento',      label: 'Evento de referencia', type: 'text',   req: true, placeholder: 'Ej: YPO México Norte — Marzo 2025' },
          { id: 'n_libros',    label: 'Número de libros',     type: 'number', req: true, min: 1, max: 10, placeholder: '1' },
          { id: 'copias_extra',label: 'Copias adicionales',   type: 'number', req: false, min: 0, max: 20, placeholder: '0',
            hint: 'Cada copia adicional tiene un costo de $70 USD' },
          { id: 'fecha_firma', label: 'Fecha de este acuerdo',type: 'date',   req: true },
        ]
      }
    ]
  },
  staff: {
    label: 'Staff',
    sections: [
      {
        title: 'Datos del Integrante',
        fields: [
          { id: 'nombre',     label: 'Nombre completo',           type: 'text', req: true, placeholder: '' },
          { id: 'rol',        label: 'Rol / función en el evento', type: 'text', req: true, placeholder: 'Ej: Coordinadora de Logística' },
          { id: 'evento',     label: 'Evento',                    type: 'text', req: true, placeholder: 'Ej: YPO México Norte — Marzo 2025' },
          { id: 'fecha_firma',label: 'Fecha de este acuerdo',     type: 'date', req: true },
        ]
      }
    ]
  },
  participante: {
    label: 'Participante',
    sections: [
      {
        title: 'Datos de la Pareja',
        fields: [
          { id: 'nombre1',    label: 'Nombre — persona 1',    type: 'text', req: true, placeholder: '' },
          { id: 'nombre2',    label: 'Nombre — persona 2',    type: 'text', req: true, placeholder: '' },
          { id: 'evento',     label: 'Evento',                type: 'text', req: true, placeholder: 'Ej: YPO México Norte — Marzo 2025' },
          { id: 'fecha_firma',label: 'Fecha de este acuerdo', type: 'date', req: true },
        ]
      }
    ]
  },
  fotografo: {
    label: 'Fotógrafo',
    sections: [
      {
        title: 'Datos del Fotógrafo',
        fields: [
          { id: 'nombre',     label: 'Fotógrafo / Empresa',   type: 'text', req: true, placeholder: '' },
          { id: 'evento',     label: 'Evento',                type: 'text', req: true, placeholder: 'Ej: YPO México Norte — Marzo 2025' },
          { id: 'fecha_firma',label: 'Fecha de este acuerdo', type: 'date', req: true },
        ]
      }
    ]
  }
};

let currentType = 'evento';

// ─────────────────────────────────────────────
// RENDER FORM
// ─────────────────────────────────────────────
function renderForm(type) {
  const def = TYPES[type];
  const container = document.getElementById('form-container');
  container.innerHTML = '';

  def.sections.forEach(section => {
    const card = document.createElement('div');
    card.className = 'form-section';
    card.innerHTML = `<div class="section-label">${section.title}</div><div class="fields" id="fields-${section.title.replace(/\s/g,'_')}"></div>`;
    container.appendChild(card);

    const fieldsEl = card.querySelector('.fields');

    section.fields.forEach(f => {
      const wrapper = document.createElement('div');
      wrapper.className = 'field';

      const labelEl = document.createElement('label');
      labelEl.setAttribute('for', f.id);
      labelEl.innerHTML = f.label + (f.req ? '<span class="req">*</span>' : '');
      wrapper.appendChild(labelEl);

      let inputEl;
      if (f.type === 'number') {
        inputEl = document.createElement('input');
        inputEl.type = 'number';
        inputEl.min = f.min ?? 0;
        if (f.max) inputEl.max = f.max;
        inputEl.placeholder = f.placeholder ?? '';
        if (f.id === 'n_parejas') inputEl.addEventListener('input', updateCostPreview);
        if (['n_libros','copias_extra'].includes(f.id)) inputEl.addEventListener('input', updateStorybookPreview);
      } else if (f.type === 'date') {
        inputEl = document.createElement('input');
        inputEl.type = 'date';
      } else {
        inputEl = document.createElement('input');
        inputEl.type = 'text';
        inputEl.placeholder = f.placeholder ?? '';
      }
      inputEl.id = f.id;
      inputEl.name = f.id;
      if (f.req) inputEl.required = true;
      wrapper.appendChild(inputEl);

      if (f.hint) {
        const hint = document.createElement('p');
        hint.className = 'field-hint';
        hint.textContent = f.hint;
        wrapper.appendChild(hint);
      }

      fieldsEl.appendChild(wrapper);
    });

    if (type === 'evento') {
      const preview = document.createElement('div');
      preview.className = 'cost-preview';
      preview.id = 'cost-preview';
      preview.innerHTML = `<span class="cost-preview-label">Costo por pareja</span><span class="cost-preview-value" id="cost-value">—</span>`;
      fieldsEl.appendChild(preview);
    }

    if (type === 'storybook') {
      const preview = document.createElement('div');
      preview.className = 'cost-preview';
      preview.id = 'cost-preview';
      preview.innerHTML = `<span class="cost-preview-label">Total estimado</span><span class="cost-preview-value" id="cost-value">$500 USD</span>`;
      fieldsEl.appendChild(preview);
    }
  });
}

function updateCostPreview() {
  const n = parseInt(document.getElementById('n_parejas')?.value) || 0;
  const cost = n <= 12 ? 4000 : n <= 16 ? 4200 : n <= 20 ? 4500 : 4700;
  const el = document.getElementById('cost-value');
  if (el) el.textContent = n >= 8 ? `$${cost.toLocaleString()} USD por pareja` : '—';
}

function updateStorybookPreview() {
  const n = parseInt(document.getElementById('n_libros')?.value) || 1;
  const extra = parseInt(document.getElementById('copias_extra')?.value) || 0;
  const el = document.getElementById('cost-value');
  if (el) el.textContent = `$${(n * 500 + extra * 70).toLocaleString()} USD`;
}

// ─────────────────────────────────────────────
// COLLECT + VALIDATE
// ─────────────────────────────────────────────
function collectData() {
  const def = TYPES[currentType];
  const data = {};
  let valid = true;

  def.sections.forEach(s => {
    s.fields.forEach(f => {
      const el = document.getElementById(f.id);
      if (!el) return;
      el.classList.remove('invalid');
      const val = el.value.trim();
      if (f.req && !val) { el.classList.add('invalid'); valid = false; }
      data[f.id] = val;
    });
  });

  return valid ? data : null;
}

// ─────────────────────────────────────────────
// LOGO LOADER — inverts dark logo to white for PDF header
// ─────────────────────────────────────────────
let _logoCache = null;
async function getLogo() {
  if (_logoCache) return _logoCache;
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = img.naturalWidth;
      cv.height = img.naturalHeight;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0);
      // Invert pixels to white, preserve transparency
      const d = ctx.getImageData(0, 0, cv.width, cv.height);
      for (let i = 0; i < d.data.length; i += 4) {
        if (d.data[i + 3] > 0) {
          d.data[i]   = 255 - d.data[i];
          d.data[i+1] = 255 - d.data[i+1];
          d.data[i+2] = 255 - d.data[i+2];
        }
      }
      ctx.putImageData(d, 0, 0);
      _logoCache = cv.toDataURL('image/png');
      resolve(_logoCache);
    };
    img.onerror = () => resolve(null);
    img.src = '../../logos/logotrascendencia.png';
  });
}

// ─────────────────────────────────────────────
// PDF DESIGN SYSTEM
// ─────────────────────────────────────────────
const W = 215.9, H = 279.4;
const ML = 22, MR = 22, CW = W - ML - MR;

// Colors — pure B&W, no café/dorado
const C_BLACK  = [10, 10, 10];
const C_TEXT   = [30, 30, 30];
const C_MUTED  = [120, 120, 120];
const C_LIGHT  = [180, 180, 180];
const C_RULE   = [220, 218, 214];
const C_ALTROW = [250, 249, 247];
const C_WHITE  = [255, 255, 255];

function pText(doc, text, x, y, maxW, { size=10, color=C_TEXT, weight='normal', lh=5.4 }={}) {
  doc.setFontSize(size);
  doc.setTextColor(...color);
  doc.setFont('helvetica', weight);
  const lines = doc.splitTextToSize(String(text), maxW);
  doc.text(lines, x, y);
  return y + lines.length * lh;
}

function pBullet(doc, text, x, y, maxW, opts={}) {
  doc.setFillColor(...C_TEXT);
  doc.circle(x + 1.8, y - 1.5, 0.7, 'F');
  return pText(doc, text, x + 5.2, y, maxW - 5.2, { size: 9.5, lh: 5.2, ...opts });
}

function pSectionLabel(doc, text, x, y) {
  doc.setFontSize(7);
  doc.setTextColor(...C_MUTED);
  doc.setFont('helvetica', 'bold');
  doc.text(text, x, y, { charSpace: 1.6 });
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.25);
  doc.line(x, y + 2.5, x + CW, y + 2.5);
  return y + 9;
}

function pSigLine(doc, label, x, y, lineW=72) {
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.4);
  doc.line(x, y, x + lineW, y);
  doc.setFontSize(7.5);
  doc.setTextColor(...C_LIGHT);
  doc.setFont('helvetica', 'normal');
  doc.text(label, x, y + 4.5);
  return y + 14;
}

function checkBreak(doc, y, needed=30) {
  if (y + needed > H - 26) {
    doc.addPage();
    addFooter(doc);
    return 24;
  }
  return y;
}

function addHeader(doc, logo) {
  // Solid black header band
  doc.setFillColor(...C_BLACK);
  doc.rect(0, 0, W, 32, 'F');

  // White logo centered in header
  if (logo) {
    const lw = 72;
    const lh = lw / 8.646;
    const lx = (W - lw) / 2;
    const ly = (32 - lh) / 2;
    doc.addImage(logo, 'PNG', lx, ly, lw, lh);
  }

  // Thin separator line
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.3);
  doc.line(0, 32, W, 32);
}

function addFooter(doc) {
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.25);
  doc.line(ML, H - 18, W - MR, H - 18);

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(6.5);
  doc.setTextColor(...C_MUTED);
  doc.text('TRASCENDENCIA', W / 2, H - 11, { align: 'center', charSpace: 1.8 });

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(6);
  doc.setTextColor(...C_LIGHT);
  doc.text('www.latrascendencia.com', W / 2, H - 6.5, { align: 'center' });
}

function addTitle(doc, subtitle) {
  // Eyebrow label
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7);
  doc.setTextColor(...C_MUTED);
  doc.text('ACUERDO DE CONFIDENCIALIDAD', W / 2, 43, { align: 'center', charSpace: 1.6 });

  // Main title — bold, black, centered
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.setTextColor(...C_BLACK);
  doc.text(subtitle, W / 2, 54, { align: 'center' });

  // Thin rule under title
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.3);
  doc.line(W / 2 - 24, 58, W / 2 + 24, 58);
}

function fmtDate(str) {
  if (!str) return '_______________';
  const [y, m, d] = str.split('-');
  const months = ['enero','febrero','marzo','abril','mayo','junio',
                  'julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${parseInt(d)} de ${months[parseInt(m)-1]} de ${y}`;
}

function fileName(type) {
  const map = { evento:'Evento', video:'Video', storybook:'Storybook', staff:'Staff', participante:'Participante', fotografo:'Fotografo' };
  return `Acuerdo_${map[type]}_${new Date().toISOString().slice(0,10)}.pdf`;
}

// ─────────────────────────────────────────────
// PDF CONTENT BUILDERS
// ─────────────────────────────────────────────

function buildEvento(doc, d) {
  let y = 68;

  y = pText(doc,
    'TRASCENDENCIA es un Proyecto de Vida, personal y de pareja, que busca explorar las raíces de la propia historia en base a los valores familiares. El objetivo es trasladar a las futuras generaciones un concepto completo de Sentido de Vida y una recopilación fotográfico-histórica narrada por los propios padres a sus hijos.',
    ML, y, CW, { size: 9.5 });
  y += 10;

  y = pSectionLabel(doc, 'DATOS DEL EVENTO', ML, y);
  [
    ['Capítulo YPO',   d.capitulo],
    ['Representante',  d.contacto],
    ['Ciudad',         d.ciudad],
    ['Fecha del evento', d.fecha_evento],
  ].forEach(([lbl, val]) => {
    doc.setFontSize(8.5);
    doc.setTextColor(...C_MUTED);
    doc.setFont('helvetica', 'normal');
    doc.text(lbl, ML, y);
    doc.setTextColor(...C_TEXT);
    doc.setFont('helvetica', 'bold');
    doc.text(val || '—', ML + 40, y);
    y += 6.2;
  });
  y += 6;

  y = pSectionLabel(doc, 'COMPROMISOS DEL EVENTO', ML, y);
  [
    'Compromiso. Es fundamental y determinante participar dos días completos como mínimo, con disposición de apertura y comunicación que permita desarrollar el concepto en su totalidad.',
    'Confidencialidad. Todo lo que se comparta en el evento se maneja bajo el Protocolo de Foro: Nunca. Nada a Nadie.',
    'Comunicación. Es mandatorio nombrar una persona de total confianza a cargo de la logística y entrega de material, con comunicación fluida y periódica.',
    'Material. El material de Trascendencia no podrá ser compartido sin previa autorización escrita por parte de la autoría.',
  ].forEach(c => {
    y = checkBreak(doc, y);
    y = pBullet(doc, c, ML, y, CW);
    y += 3;
  });
  y += 6;

  y = checkBreak(doc, y, 65);
  y = pSectionLabel(doc, 'COSTO Y FORMA DE PAGO', ML, y);

  const n = parseInt(d.n_parejas) || 0;
  const tierCost = n <= 12 ? 4000 : n <= 16 ? 4200 : n <= 20 ? 4500 : 4700;

  doc.autoTable({
    startY: y,
    margin: { left: ML, right: MR },
    head: [['Número de parejas', 'Costo por pareja']],
    body: [
      ['8 a 12 parejas',  '$4,000 USD'],
      ['13 a 16 parejas', '$4,200 USD'],
      ['17 a 20 parejas', '$4,500 USD'],
      ['21 a 24 parejas', '$4,700 USD'],
    ],
    headStyles:  { fillColor: C_BLACK, textColor: C_WHITE, fontStyle: 'bold', fontSize: 8, cellPadding: 4 },
    bodyStyles:  { fontSize: 9, textColor: C_TEXT, cellPadding: 3.5 },
    alternateRowStyles: { fillColor: C_ALTROW },
    styles: { lineColor: C_RULE, lineWidth: 0.25 },
    didDrawCell: (data) => {
      if (data.section === 'body' && data.column.index === 0) {
        const rowCosts = [4000, 4200, 4500, 4700];
        if (rowCosts[data.row.index] === tierCost) {
          doc.setFillColor(...C_TEXT);
          doc.rect(data.cell.x, data.cell.y, 1.8, data.cell.height, 'F');
        }
      }
    }
  });

  y = doc.lastAutoTable.finalY + 7;
  doc.setFontSize(9.5);
  doc.setTextColor(...C_TEXT);
  doc.setFont('helvetica', 'normal');
  doc.text('Número de parejas acordado para este evento:', ML, y);
  doc.setFont('helvetica', 'bold');
  doc.text(`${d.n_parejas} parejas`, ML + 91, y);
  y += 6;
  doc.setFont('helvetica', 'normal');
  doc.text('Forma de pago:', ML, y);
  doc.setFont('helvetica', 'bold');
  doc.text('50% al confirmar · 50% una semana antes del evento', ML + 36, y);
  y += 11;

  y = checkBreak(doc, y, 40);
  y = pSectionLabel(doc, 'POLÍTICAS DE CANCELACIÓN', ML, y);
  y = pBullet(doc, 'En caso de cancelación el monto no será reembolsado.', ML, y, CW);
  y += 3;
  y = pBullet(doc, 'Cláusula de fuerza mayor: En caso de inundación, terremoto, erupción volcánica o problemas políticos, ambas partes de común acuerdo encontrarán la fecha que mejor les convenga para realizar el evento posteriormente.', ML, y, CW);
  y += 14;

  y = checkBreak(doc, y, 35);
  doc.setFontSize(8);
  doc.setTextColor(...C_LIGHT);
  doc.setFont('helvetica', 'italic');
  doc.text(`Ciudad: ${d.ciudad || '_______________'}   ·   Fecha: ${fmtDate(d.fecha_firma)}`, ML, y);
  y += 12;

  pSigLine(doc, 'Firma del capítulo / representante', ML, y, 110);
}

  let y = 68;

    'A través de este acuerdo, el firmante se compromete a guardar con prudencia la confidencialidad en torno a todos los aspectos del evento Trascendencia, concretamente:',
    ML, y, CW, { size: 9.5 });
  y += 9;

  bullets.forEach(b => {
    y = checkBreak(doc, y);
    y = pBullet(doc, b, ML, y, CW);
    y += 3.5;
  });
  y += 7;

  y = checkBreak(doc, y, 30);
  y = pText(doc,
    'Soy consciente de que guardar esta confidencialidad es una de las razones por las que fui seleccionado/a para ser parte del equipo de Trascendencia.',
    ML, y, CW, { size: 9, color: C_MUTED });

  y = checkBreak(doc, y, 50);

  doc.setTextColor(...C_LIGHT);

}

// ─────────────────────────────────────────────
// MAIN GENERATOR
// ─────────────────────────────────────────────
async function generatePDF(type, data) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ format: 'letter', unit: 'mm' });
  const logo = await getLogo();

  const subtitles = {
    evento:       'Evento Trascendencia',
    video:        'Equipo de Video',
    storybook:    'Storybook',
    staff:        'Staff',
    participante: 'Participantes',
    fotografo:    'Fotógrafo',
  };

  addHeader(doc, logo);
  addFooter(doc);
  addTitle(doc, subtitles[type]);

  switch (type) {
    case 'evento':       buildEvento(doc, data);       break;
    case 'video':        buildVideo(doc, data);        break;
    case 'storybook':    buildStorybook(doc, data);    break;
    case 'staff':        buildStaff(doc, data);        break;
    case 'participante': buildParticipante(doc, data); break;
    case 'fotografo':    buildFotografo(doc, data);    break;
  }

  doc.save(fileName(type));
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
function showToast(msg, kind='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${kind} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  // Hash navigation — activates tab from URL hash (e.g. #staff)
  const hashType = window.location.hash.slice(1);
  if (hashType && TYPES[hashType]) {
    currentType = hashType;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.type === hashType);
    });
  }

  renderForm(currentType);

  document.getElementById('type-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    history.replaceState(null, '', '#' + currentType);
    renderForm(currentType);
  });

  document.getElementById('btn-generate').addEventListener('click', async () => {
    const data = collectData();
    if (!data) { showToast('Completa los campos requeridos', 'error'); return; }
    const btn = document.getElementById('btn-generate');
    btn.disabled = true;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Generando…`;
    try {
      await generatePDF(currentType, data);
      showToast('PDF generado correctamente');
    } catch (err) {
      showToast('Error al generar el PDF', 'error');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Generar PDF`;
    }
  });
});
</script>
