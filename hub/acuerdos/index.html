<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Acuerdos — Trascendencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --surface2:  #1c1c1c;
      --border:    #272727;
      --border-hi: #3a3a3a;
      --text:      #f8f7f5;
      --muted:     #666666;
      --error:     #c0504a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .back-link {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .back-link:hover { color: var(--text); }
    .header-sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
    .header-logo { height: 18px; width: auto; filter: brightness(0) invert(1); opacity: 0.75; }
    .header-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-left: auto;
    }

    /* ── LAYOUT ── */
    .main { max-width: 680px; margin: 0 auto; padding: 36px 24px 120px; }

    /* ── STEP VISIBILITY ── */
    .step { }
    .step.hidden { display: none; }

    /* ── TYPE TABS ── */
    .type-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 28px;
    }
    .tab {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      padding: 7px 14px;
      transition: all 0.15s;
      text-transform: uppercase;
    }
    .tab:hover { border-color: var(--border-hi); color: var(--text); }
    .tab.active { background: var(--text); border-color: var(--text); color: var(--bg); }

    /* ── FORM SECTION ── */
    .form-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 12px;
    }
    .section-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .fields { display: flex; flex-direction: column; gap: 14px; }
    .fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field label .req { color: var(--text); opacity: 0.5; margin-left: 2px; }
    .field input,
    .field select,
    .field textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 400;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
      -webkit-appearance: none;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus { border-color: var(--border-hi); }
    .field input.invalid,
    .field select.invalid { border-color: var(--error); }
    .field input::placeholder,
    .field textarea::placeholder { color: #3a3a3a; }
    .field select option { background: #141414; }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-hint { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .cost-preview {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .cost-preview-label { font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: 0.06em; }
    .cost-preview-value { font-size: 15px; font-weight: 700; color: var(--text); }

    /* ── BUTTONS ── */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--text);
      border: none;
      border-radius: 6px;
      color: var(--bg);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 14px 28px;
      width: 100%;
      transition: opacity 0.15s;
      margin-top: 4px;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary svg { width: 15px; height: 15px; flex-shrink: 0; }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 9px 16px;
      transition: all 0.15s;
    }
    .btn-ghost:hover { border-color: var(--border-hi); color: var(--text); }

    .btn-solid-sm {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--text);
      border: none;
      border-radius: 5px;
      color: var(--bg);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 9px 20px;
      transition: opacity 0.15s;
    }
    .btn-solid-sm:hover { opacity: 0.88; }
    .btn-solid-sm:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-solid-sm svg { width: 13px; height: 13px; flex-shrink: 0; }

    /* ── PREVIEW BAR ── */
    .preview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 12px;
    }
    .preview-bar-hint {
      font-size: 10px;
      color: var(--muted);
      font-style: italic;
    }

    /* ── DOCUMENT SHEET ── */
    .doc-sheet {
      background: #ffffff;
      border-radius: 6px;
      padding: 60px 64px 56px;
      color: #1a1a1a;
      font-family: 'Montserrat', sans-serif;
      font-size: 10.5px;
      line-height: 1.75;
      box-shadow: 0 4px 32px rgba(0,0,0,0.6);
    }

    .doc-logo-row {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .doc-logo { height: 20px; width: auto; }

    .doc-eyebrow {
      text-align: center;
      font-size: 6.5px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 5px;
    }
    .doc-title {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #111;
    }
    .doc-title-rule {
      width: 44px;
      height: 1px;
      background: #d8d6d2;
      margin: 12px auto 32px;
    }

    /* contenteditable affordance */
    [contenteditable] {
      outline: none;
      border-radius: 3px;
      transition: background 0.15s, outline 0.15s;
    }
    [contenteditable]:hover {
      background: rgba(66, 99, 235, 0.04);
    }
    [contenteditable]:focus {
      background: rgba(66, 99, 235, 0.06);
      outline: 1px solid rgba(66, 99, 235, 0.18);
    }

    .doc-intro {
      font-size: 10.5px;
      color: #1a1a1a;
      margin-bottom: 28px;
      padding: 3px 5px;
    }

    .doc-article {
      margin-bottom: 20px;
    }

    .doc-art-hd {
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #555;
      padding: 2px 5px 8px;
      border-bottom: 1px solid #e6e4e0;
      margin-bottom: 10px;
    }

    .doc-art-body {
      font-size: 10.5px;
      color: #222;
      padding: 3px 5px;
      line-height: 1.78;
    }

    .doc-meta {
      margin-top: 32px;
      font-size: 9px;
      color: #aaa;
      padding: 2px 5px;
    }

    .doc-sigs {
      display: flex;
      gap: 36px;
      margin-top: 32px;
    }
    .doc-sig { flex: 1; }
    .doc-sig-bar {
      height: 1px;
      background: #ccc;
      margin-bottom: 7px;
    }
    .doc-sig-label {
      font-size: 8.5px;
      color: #aaa;
      font-weight: 500;
    }

    .doc-footer {
      text-align: center;
      margin-top: 44px;
      padding-top: 18px;
      border-top: 1px solid #ece9e4;
      font-size: 6.5px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #bbb;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 6px;
      padding: 11px 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(192,80,74,0.5); color: #e07070; }

    @media (max-width: 600px) {
      .doc-sheet { padding: 36px 28px 40px; }
      .doc-sigs { flex-direction: column; gap: 24px; }
    }
  </style>
</head>
<body>

<header class="page-header">
  <a href="../" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Hub
  </a>
  <div class="header-sep"></div>
  <img class="header-logo" src="../../logos/logotrascendencia.png" alt="Trascendencia">
  <span class="header-title">Acuerdos de Confidencialidad</span>
</header>

<main class="main">

  <!-- ── STEP 1: FORM ── -->
  <div id="step-form" class="step">

    <div class="type-tabs" id="type-tabs">
      <button class="tab active" data-type="evento">Evento</button>
      <button class="tab" data-type="video">Equipo de Video</button>
      <button class="tab" data-type="storybook">Storybook</button>
      <button class="tab" data-type="staff">Staff</button>
      <button class="tab" data-type="participante">Participante</button>
      <button class="tab" data-type="fotografo">Fotógrafo</button>
    </div>

    <div id="form-container"></div>

    <button class="btn-primary" id="btn-preview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
      </svg>
      Ver Documento
    </button>

  </div>

  <!-- ── STEP 2: PREVIEW ── -->
  <div id="step-preview" class="step hidden">

    <div class="preview-bar">
      <button class="btn-ghost" id="btn-back">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Editar datos
      </button>
      <span class="preview-bar-hint">Haz clic en el texto para editar antes de imprimir</span>
      <button class="btn-solid-sm" id="btn-pdf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Generar PDF
      </button>
    </div>

    <div class="doc-sheet">
      <div id="doc-content"></div>
    </div>

  </div>

</main>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────
// FORM DEFINITIONS
// ─────────────────────────────────────────────
const TYPES = {
  evento: {
    label: 'Evento Trascendencia',
    sections: [{
      title: 'Datos del Evento',
      fields: [
        { id: 'capitulo',     label: 'Capítulo / Organización',      type: 'text',   req: true,  placeholder: 'Ej: YPO México Norte' },
        { id: 'contacto',     label: 'Representante',                type: 'text',   req: true,  placeholder: 'Nombre completo' },
        { id: 'ciudad',       label: 'Ciudad del evento',            type: 'text',   req: true,  placeholder: 'Ej: Antigua, Guatemala' },
        { id: 'fecha_evento', label: 'Fecha del evento',             type: 'text',   req: true,  placeholder: 'Ej: 14–16 de marzo, 2025' },
        { id: 'n_parejas',    label: 'Número de parejas',            type: 'number', req: true,  min: 8, max: 24, placeholder: '8' },
        { id: 'fecha_firma',  label: 'Fecha de este acuerdo',        type: 'date',   req: true },
      ]
    }]
  },
  video: {
    label: 'Equipo de Video',
    sections: [{
      title: 'Datos del Prestador',
      fields: [
        { id: 'empresa',     label: 'Empresa / Responsable',  type: 'text', req: true, placeholder: 'Ej: Maleta Films' },
        { id: 'evento',      label: 'Evento',                 type: 'text', req: true, placeholder: 'Ej: YPO México Norte — Marzo 2025' },
        { id: 'fecha_firma', label: 'Fecha de este acuerdo',  type: 'date', req: true },
      ]
    }]
  },
  storybook: {
    label: 'Storybook',
    sections: [{
      title: 'Datos del Encargo',
      fields: [
        { id: 'familia',      label: 'Familia',               type: 'text',   req: true,  placeholder: 'Ej: Familia Rodríguez Sánchez' },
        { id: 'disenadora',   label: 'Coordinadora de diseño',type: 'text',   req: true,  placeholder: 'Nombre completo' },
        { id: 'evento',       label: 'Evento de referencia',  type: 'text',   req: true,  placeholder: 'Ej: YPO México Norte — Marzo 2025' },
        { id: 'n_libros',     label: 'Número de libros',      type: 'number', req: true,  min: 1, max: 10, placeholder: '1' },
        { id: 'copias_extra', label: 'Copias adicionales',    type: 'number', req: false, min: 0, max: 20, placeholder: '0',
          hint: 'Cada copia adicional: $70 USD' },
        { id: 'fecha_firma',  label: 'Fecha de este acuerdo', type: 'date',   req: true },
      ]
    }]
  },
  staff: {
    label: 'Staff',
    sections: [{
      title: 'Datos del Colaborador',
      fields: [
        { id: 'nombre',      label: 'Nombre completo',            type: 'text', req: true, placeholder: '' },
        { id: 'rol',         label: 'Rol en el evento',           type: 'text', req: true, placeholder: 'Ej: Coordinadora de Logística' },
        { id: 'evento',      label: 'Evento',                     type: 'text', req: true, placeholder: 'Ej: YPO México Norte — Marzo 2025' },
        { id: 'fecha_firma', label: 'Fecha de este acuerdo',      type: 'date', req: true },
      ]
    }]
  },
  participante: {
    label: 'Participante',
    sections: [{
      title: 'Datos de la Pareja',
      fields: [
        { id: 'nombre1',     label: 'Nombre — persona 1',    type: 'text', req: true,  placeholder: '' },
        { id: 'nombre2',     label: 'Nombre — persona 2',    type: 'text', req: false, placeholder: '(opcional si asiste solo/a)' },
        { id: 'evento',      label: 'Evento',                type: 'text', req: true,  placeholder: 'Ej: YPO México Norte — Marzo 2025' },
        { id: 'fecha_firma', label: 'Fecha de este acuerdo', type: 'date', req: true },
      ]
    }]
  },
  fotografo: {
    label: 'Fotógrafo',
    sections: [{
      title: 'Datos del Fotógrafo',
      fields: [
        { id: 'nombre',      label: 'Fotógrafo / Empresa',   type: 'text', req: true, placeholder: '' },
        { id: 'evento',      label: 'Evento',                type: 'text', req: true, placeholder: 'Ej: YPO México Norte — Marzo 2025' },
        { id: 'fecha_firma', label: 'Fecha de este acuerdo', type: 'date', req: true },
      ]
    }]
  }
};

let currentType = 'evento';

// ─────────────────────────────────────────────
// DOCUMENT BUILDERS — full legal text
// ─────────────────────────────────────────────
const DOCS = {
  evento: {
    title: 'Evento Trascendencia',
    build: (d) => ({
      intro: `El Capítulo ${d.capitulo || '___'}, representado por ${d.contacto || '___'} (en adelante, "El Capítulo"), y TRASCENDENCIA (en adelante, "La Empresa"), acuerdan los siguientes términos para la realización del evento que tendrá lugar en ${d.ciudad || '___'}, el ${d.fecha_evento || '___'}.`,
      articles: [
        {
          heading: 'Art. 1 · Objeto del Acuerdo',
          body: 'El presente documento formaliza los compromisos de participación, confidencialidad, inversión y políticas de cancelación para el evento TRASCENDENCIA descrito en el encabezado.'
        },
        {
          heading: 'Art. 2 · Compromisos de Participación',
          body: '1. Las parejas participantes deberán asistir un mínimo de dos días completos con disposición de apertura y comunicación.\n2. El Capítulo nombrará un contacto de logística con comunicación fluida y periódica con La Empresa.\n3. El contacto designado será el canal oficial de coordinación durante todo el proceso previo y durante el evento.'
        },
        {
          heading: 'Art. 3 · Confidencialidad',
          body: 'Todo lo compartido durante el evento se rige por el Protocolo de Foro: Nunca. Nada a Nadie.\n\nEl material de TRASCENDENCIA no podrá ser compartido, reproducido ni publicado sin autorización escrita por parte de La Empresa. Esta obligación es permanente y no se extingue al finalizar el evento.'
        },
        {
          heading: 'Art. 4 · Inversión y Forma de Pago',
          body: `Número de parejas acordado: ${d.n_parejas || '___'}\n\nEscala de costo por pareja:\n· 8–12 parejas   →   $4,000 USD\n· 13–16 parejas  →   $4,200 USD\n· 17–20 parejas  →   $4,500 USD\n· 21–24 parejas  →   $4,700 USD\n\nForma de pago: 50 % al confirmar el evento · 50 % una semana antes del evento.`
        },
        {
          heading: 'Art. 5 · Política de Cancelación',
          body: 'En caso de cancelación por parte del Capítulo, el monto abonado no será reembolsado.\n\nCláusula de fuerza mayor: ante inundación, terremoto, erupción volcánica o conflicto político grave, ambas partes acordarán de común acuerdo una nueva fecha para la realización del evento.'
        },
        {
          heading: 'Art. 6 · Aceptación',
          body: 'Al firmar el presente acuerdo, El Capítulo declara haber leído, comprendido y aceptado en su totalidad las condiciones aquí establecidas.'
        }
      ],
      meta: `${d.ciudad || '_______________'}   ·   ${fmtDate(d.fecha_firma)}`,
      sigs: [{ label: `${d.contacto || 'Representante del Capítulo'}  ·  ${d.capitulo || ''}` }]
    })
  },

  video: {
    title: 'Equipo de Video',
    build: (d) => ({
      intro: `Por medio del presente, ${d.empresa || '___'} (en adelante, "El Prestador") acepta los términos de confidencialidad establecidos por TRASCENDENCIA para la prestación de servicios de edición y producción de video en el evento "${d.evento || '___'}".`,
      articles: [
        {
          heading: 'Art. 1 · Objeto del Acuerdo',
          body: 'El presente acuerdo regula la relación de confidencialidad entre El Prestador y TRASCENDENCIA en el marco del evento referenciado, garantizando la protección del contenido, la identidad de las personas y los materiales producidos.'
        },
        {
          heading: 'Art. 2 · Confidencialidad',
          body: '1. Guardar absoluta confidencialidad sobre las personas, historias y testimonios compartidos durante el evento.\n2. Conservar el anonimato de los participantes, absteniéndose de comentarios, murmuraciones o referencias externas a las historias escuchadas.\n3. Bajo ninguna condición difundir el material filmado, el detalle de las actividades ni el material de los participantes.\n4. No publicar material relacionado con el evento en redes sociales ni utilizarlo para publicidad o portafolio propio.\n5. El material filmado es propiedad exclusiva de cada familia y de TRASCENDENCIA. Su uso está estrictamente restringido a la entrega final acordada.'
        },
        {
          heading: 'Art. 3 · Propiedad Intelectual',
          body: 'El material filmado y producido durante el evento es propiedad exclusiva de TRASCENDENCIA y de cada familia participante. El Prestador renuncia expresamente a cualquier derecho de uso, reproducción o distribución sobre dicho material.'
        },
        {
          heading: 'Art. 4 · Calidad y Correcciones',
          body: 'El Prestador se compromete a entregar el material con los estándares de calidad acordados previamente. Las correcciones solicitadas por TRASCENDENCIA deberán realizarse dentro del plazo pactado, sin costo adicional.'

// RENDER FORM

function renderForm(type) {
  const def = TYPES[type];
  const container = document.getElementById('form-container');
  container.innerHTML = '';

  def.sections.forEach(section => {
    const card = document.createElement('div');
    card.className = 'form-section';
    card.innerHTML = `<div class="section-label">${section.title}</div><div class="fields"></div>`;
    container.appendChild(card);

    const fieldsEl = card.querySelector('.fields');

    section.fields.forEach(f => {
      const wrapper = document.createElement('div');
      wrapper.className = 'field';

      const labelEl = document.createElement('label');
      labelEl.setAttribute('for', f.id);
      labelEl.innerHTML = f.label + (f.req ? '<span class="req">*</span>' : '');
      wrapper.appendChild(labelEl);

      let inputEl;
      if (f.type === 'number') {
        inputEl = document.createElement('input');
        inputEl.type = 'number';
        inputEl.min = f.min ?? 0;
        if (f.max) inputEl.max = f.max;
        inputEl.placeholder = f.placeholder ?? '';
        if (f.id === 'n_parejas')   inputEl.addEventListener('input', updateEventoPreview);
        if (['n_libros','copias_extra'].includes(f.id)) inputEl.addEventListener('input', updateStorybookPreview);
      } else if (f.type === 'date') {
        inputEl = document.createElement('input');
        inputEl.type = 'date';
      } else {
        inputEl = document.createElement('input');
        inputEl.type = 'text';
        inputEl.placeholder = f.placeholder ?? '';
      }
      inputEl.id = f.id;
      inputEl.name = f.id;
      if (f.req) inputEl.required = true;
      wrapper.appendChild(inputEl);

      if (f.hint) {
        const hint = document.createElement('p');
        hint.className = 'field-hint';
        hint.textContent = f.hint;
        wrapper.appendChild(hint);
      }

      fieldsEl.appendChild(wrapper);
    });

    if (type === 'evento') {
      const preview = document.createElement('div');
      preview.className = 'cost-preview';
      preview.id = 'cost-preview';
      preview.innerHTML = `<span class="cost-preview-label">Costo por pareja</span><span class="cost-preview-value" id="cost-value">—</span>`;
      fieldsEl.appendChild(preview);
    }

    if (type === 'storybook') {
      const preview = document.createElement('div');
      preview.className = 'cost-preview';
      preview.id = 'cost-preview';
      preview.innerHTML = `<span class="cost-preview-label">Total estimado</span><span class="cost-preview-value" id="cost-value">$500 USD</span>`;
      fieldsEl.appendChild(preview);
    }
  });
}

function updateEventoPreview() {
  const n = parseInt(document.getElementById('n_parejas')?.value) || 0;
  const cost = n <= 12 ? 4000 : n <= 16 ? 4200 : n <= 20 ? 4500 : 4700;
  const el = document.getElementById('cost-value');
  if (el) el.textContent = n >= 8 ? `$${cost.toLocaleString()} USD por pareja` : '—';
}

function updateStorybookPreview() {
  const n     = parseInt(document.getElementById('n_libros')?.value)     || 1;
  const extra = parseInt(document.getElementById('copias_extra')?.value) || 0;
  const el = document.getElementById('cost-value');
  if (el) el.textContent = `$${(n * 500 + extra * 70).toLocaleString()} USD`;
}

function collectData() {
  const def = TYPES[currentType];
  const data = {};
  let valid = true;

  def.sections.forEach(s => {
    s.fields.forEach(f => {
      const el = document.getElementById(f.id);
      if (!el) return;
      el.classList.remove('invalid');
      const val = el.value.trim();
      if (f.req && !val) { el.classList.add('invalid'); valid = false; }
      data[f.id] = val;
    });
  });

  return valid ? data : null;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

function renderPreview(type, data) {
  const docDef = DOCS[type].build(data);
  const container = document.getElementById('doc-content');

  let html = '';

  // Logo + title block
  html += `
    <div class="doc-logo-row">
      <img class="doc-logo" src="../../logos/logotrascendencia.png" alt="Trascendencia">
    </div>
    <div class="doc-eyebrow">Acuerdo de Confidencialidad</div>
    <div class="doc-title">${escHtml(DOCS[type].title)}</div>
    <div class="doc-title-rule"></div>
  `;

  // Intro paragraph
  if (docDef.intro) {
    html += `<div class="doc-intro" contenteditable="true" data-doc="intro">${escHtml(docDef.intro)}</div>`;
  }

  // Articles
  docDef.articles.forEach((art, i) => {
    html += `
      <div class="doc-article">
        <div class="doc-art-hd" contenteditable="true" data-doc="art-hd-${i}">${escHtml(art.heading)}</div>
        <div class="doc-art-body" contenteditable="true" data-doc="art-body-${i}">${escHtml(art.body)}</div>
      </div>
    `;
  });

  // Meta line (date/city)
  if (docDef.meta) {
    html += `<div class="doc-meta" contenteditable="true" data-doc="meta">${escHtml(docDef.meta)}</div>`;
  }

  // Signature lines
  html += `<div class="doc-sigs">`;
  docDef.sigs.forEach((sig, i) => {
    html += `
      <div class="doc-sig">
        <div class="doc-sig-bar"></div>
        <div class="doc-sig-label" data-doc="sig-${i}">${escHtml(sig.label)}</div>
      </div>
    `;
  });
  html += `</div>`;

  // Footer
  html += `<div class="doc-footer">TRASCENDENCIA &nbsp;·&nbsp; www.latrascendencia.com</div>`;

  container.innerHTML = html;
}

// LOGO LOADER
// ─────────────────────────────────────────────
let _logoCache = null;
async function getLogo() {
  if (_logoCache) return _logoCache;
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0);
      // Invert dark logo to white for PDF header
      const d = ctx.getImageData(0, 0, cv.width, cv.height);
      for (let i = 0; i < d.data.length; i += 4) {
        if (d.data[i + 3] > 0) {
          d.data[i]   = 255 - d.data[i];
          d.data[i+1] = 255 - d.data[i+1];
          d.data[i+2] = 255 - d.data[i+2];
        }
      }
      ctx.putImageData(d, 0, 0);
      _logoCache = cv.toDataURL('image/png');
      resolve(_logoCache);
    };
    img.onerror = () => resolve(null);
    img.src = '../../logos/logotrascendencia.png';
  });
}

// ─────────────────────────────────────────────
// PDF DESIGN SYSTEM
// ─────────────────────────────────────────────
const W = 215.9, H = 279.4;
const ML = 22, MR = 22, CW = W - ML - MR;

const C_BLACK  = [10, 10, 10];
const C_TEXT   = [30, 30, 30];
const C_MUTED  = [120, 120, 120];
const C_LIGHT  = [180, 180, 180];
const C_RULE   = [220, 218, 214];
const C_WHITE  = [255, 255, 255];

function pText(doc, text, x, y, maxW, { size=10, color=C_TEXT, weight='normal', lh=5.4 }={}) {
  doc.setFontSize(size);
  doc.setTextColor(...color);
  doc.setFont('helvetica', weight);
  const lines = doc.splitTextToSize(String(text), maxW);
  doc.text(lines, x, y);
  return y + lines.length * lh;
}

function pBullet(doc, text, x, y, maxW, opts={}) {
  doc.setFillColor(...C_TEXT);
  doc.circle(x + 1.8, y - 1.5, 0.7, 'F');
  return pText(doc, text, x + 5.2, y, maxW - 5.2, { size: 9.5, lh: 5.2, ...opts });
}

function pNumbered(doc, num, text, x, y, maxW) {
  doc.setFontSize(9.5);
  doc.setTextColor(...C_TEXT);
  doc.setFont('helvetica', 'bold');
  doc.text(String(num) + '.', x, y);
  doc.setFont('helvetica', 'normal');
  const lines = doc.splitTextToSize(text, maxW - 8);
  doc.text(lines, x + 7, y);
  return y + lines.length * 5.2;
}

function pSectionLabel(doc, text, x, y) {
  doc.setFontSize(7);
  doc.setTextColor(...C_MUTED);
  doc.setFont('helvetica', 'bold');
  doc.text(text.toUpperCase(), x, y, { charSpace: 1.4 });
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.25);
  doc.line(x, y + 2.5, x + CW, y + 2.5);
  return y + 10;
}

function pSigLine(doc, label, x, y, lineW=72) {
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.4);
  doc.line(x, y, x + lineW, y);
  doc.setFontSize(7.5);
  doc.setTextColor(...C_LIGHT);
  doc.setFont('helvetica', 'normal');
  const lines = doc.splitTextToSize(label, lineW);
  doc.text(lines, x, y + 4.5);
  return y + 14;
}

function checkBreak(doc, y, needed=30) {
  if (y + needed > H - 26) {
    doc.addPage();
    addFooter(doc);
    return 24;
  }
  return y;
}

function addHeader(doc, logo) {
  doc.setFillColor(...C_BLACK);
  doc.rect(0, 0, W, 32, 'F');
  if (logo) {
    const lw = 72, lh = lw / 8.646;
    doc.addImage(logo, 'PNG', (W - lw) / 2, (32 - lh) / 2, lw, lh);
  }
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.3);
  doc.line(0, 32, W, 32);
}

function addFooter(doc) {
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.25);
  doc.line(ML, H - 18, W - MR, H - 18);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(6.5);
  doc.setTextColor(...C_MUTED);
  doc.text('TRASCENDENCIA', W / 2, H - 11, { align: 'center', charSpace: 1.8 });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(6);
  doc.setTextColor(...C_LIGHT);
  doc.text('www.latrascendencia.com', W / 2, H - 6.5, { align: 'center' });
}

function addTitle(doc, subtitle) {
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7);
  doc.setTextColor(...C_MUTED);
  doc.text('ACUERDO DE CONFIDENCIALIDAD', W / 2, 43, { align: 'center', charSpace: 1.6 });
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.setTextColor(...C_BLACK);
  doc.text(subtitle.toUpperCase(), W / 2, 54, { align: 'center' });
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.3);
  doc.line(W / 2 - 24, 58, W / 2 + 24, 58);
}

function fmtDate(str) {
  if (!str) return '_______________';
  const [y, m, d] = str.split('-');
  const months = ['enero','febrero','marzo','abril','mayo','junio',
                  'julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${parseInt(d)} de ${months[parseInt(m)-1]} de ${y}`;
}

function fileName(type) {
  const map = { evento:'Evento', video:'Video', storybook:'Storybook', staff:'Staff', participante:'Participante', fotografo:'Fotografo' };
  return `Acuerdo_${map[type]}_${new Date().toISOString().slice(0,10)}.pdf`;
}

// ─────────────────────────────────────────────
// PDF BUILDER — reads from contenteditable DOM
// ─────────────────────────────────────────────
async function generatePDFFromDoc(type) {
  const { jsPDF } = window.jspdf;
  const doc  = new jsPDF({ format: 'letter', unit: 'mm' });
  const logo = await getLogo();

  addHeader(doc, logo);
  addFooter(doc);
  addTitle(doc, DOCS[type].title);

  let y = 68;

  // ── Intro
  const introEl = document.querySelector('[data-doc="intro"]');
  if (introEl) {
    const introText = introEl.innerText.trim();
    if (introText) {
      y = pText(doc, introText, ML, y, CW, { size: 9.5 });
      y += 10;
    }
  }

  // ── Articles
  const hdEls   = document.querySelectorAll('[data-doc^="art-hd-"]');
  const bodyEls = document.querySelectorAll('[data-doc^="art-body-"]');

  hdEls.forEach((hdEl, i) => {
    const heading  = hdEl.innerText.trim();
    const bodyText = bodyEls[i]?.innerText.trim() || '';

    y = checkBreak(doc, y, 32);
    y = pSectionLabel(doc, heading, ML, y);

    if (bodyText) {
      const lines = bodyText.split('\n').filter(l => l.trim());
      lines.forEach(line => {
        const t = line.trim();
        const numberedMatch = t.match(/^(\d+)\.\s+([\s\S]+)/);
        const bulletMatch   = t.match(/^[·•\-]\s+([\s\S]+)/);

        if (numberedMatch) {
          y = checkBreak(doc, y, 14);
          y = pNumbered(doc, numberedMatch[1], numberedMatch[2], ML, y, CW);
          y += 3;
        } else if (bulletMatch) {
          y = checkBreak(doc, y);
          y = pBullet(doc, bulletMatch[1], ML, y, CW);
          y += 3;
        } else if (t) {
          y = checkBreak(doc, y);
          y = pText(doc, t, ML, y, CW, { size: 9.5 });
          y += 4;
        }
      });
      y += 4;
    }
  });

  // ── Meta
  const metaEl = document.querySelector('[data-doc="meta"]');
  if (metaEl) {
    const metaText = metaEl.innerText.trim();
    if (metaText) {
      y = checkBreak(doc, y, 20);
      doc.setFontSize(8);
      doc.setTextColor(...C_LIGHT);
      doc.setFont('helvetica', 'normal');
      doc.text(metaText, ML, y);
      y += 13;
    }
  }

  // ── Signatures
  const sigEls = document.querySelectorAll('[data-doc^="sig-"]');
  y = checkBreak(doc, y, 30);

  if (sigEls.length === 1) {
    pSigLine(doc, sigEls[0].innerText.trim(), ML, y, 110);
  } else if (sigEls.length >= 2) {
    pSigLine(doc, sigEls[0].innerText.trim(), ML,      y, 82);
    pSigLine(doc, sigEls[1].innerText.trim(), ML + 98, y, 82);
  }

  doc.save(fileName(type));
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
function showToast(msg, kind='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${kind} show`;
  setTimeout(() => t.classList.remove('show'), 3200);
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {

  // Hash navigation
  const hashType = window.location.hash.slice(1);
  if (hashType && TYPES[hashType]) {
    currentType = hashType;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.type === hashType);
    });
  }

  renderForm(currentType);

  // Tab switching
  document.getElementById('type-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    history.replaceState(null, '', '#' + currentType);
    renderForm(currentType);
  });

  // "Ver Documento" — validate → render preview → show step 2
  document.getElementById('btn-preview').addEventListener('click', () => {
    const data = collectData();
    if (!data) { showToast('Completa los campos requeridos', 'error'); return; }

    renderPreview(currentType, data);
    document.getElementById('step-form').classList.add('hidden');
    document.getElementById('step-preview').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // "← Editar datos" — back to form
  document.getElementById('btn-back').addEventListener('click', () => {
    document.getElementById('step-preview').classList.add('hidden');
    document.getElementById('step-form').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // "Generar PDF" — build from DOM
  document.getElementById('btn-pdf').addEventListener('click', async () => {
    const btn = document.getElementById('btn-pdf');
    btn.disabled = true;
    const original = btn.innerHTML;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Generando…`;
    try {
      await generatePDFFromDoc(currentType);
      showToast('PDF generado correctamente');
    } catch (err) {
      showToast('Error al generar el PDF', 'error');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerHTML = original;
    }
  });

});
</script>
