<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Agenda del Evento · Trascendencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --surface2:  #1c1c1c;
      --border:    #272727;
      --border-hi: #3a3a3a;
      --text:      #f8f7f5;
      --muted:     #666666;
      --error:     #c0504a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
    }

    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .back-link {
      display: flex; align-items: center; gap: 5px;
      color: var(--muted); text-decoration: none;
      font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
      transition: color 0.2s; flex-shrink: 0;
    }
    .back-link:hover { color: var(--text); }
    .header-sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
    .header-logo { height: 18px; width: auto; filter: brightness(0) invert(1); opacity: 0.75; }
    .header-title {
      font-size: 10px; font-weight: 600; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--muted); margin-left: auto;
    }

    .main { max-width: 640px; margin: 0 auto; padding: 36px 24px 120px; }

    .form-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 12px;
    }
    .section-label {
      font-size: 9px; font-weight: 700; letter-spacing: 0.24em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 18px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .fields { display: flex; flex-direction: column; gap: 14px; }
    .fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fields-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
    }
    .field label .req { color: var(--text); opacity: 0.4; margin-left: 2px; }
    .field input, .field select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
      -webkit-appearance: none;
    }
    .field input:focus, .field select:focus { border-color: var(--border-hi); }
    .field input.invalid { border-color: var(--error); }
    .field input::placeholder { color: #3a3a3a; }
    .field select option { background: #141414; }
    .field-hint { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* version selector */
    .version-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
    }
    .vtab {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 7px 14px;
      transition: all 0.15s;
      text-transform: uppercase;
    }
    .vtab:hover { border-color: var(--border-hi); color: var(--text); }
    .vtab.active { background: var(--text); border-color: var(--text); color: var(--bg); }

    .btn-generate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--text);
      border: none;
      border-radius: 6px;
      color: var(--bg);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 14px 28px;
      width: 100%;
      transition: opacity 0.15s;
    }
    .btn-generate:hover { opacity: 0.88; }
    .btn-generate:disabled { opacity: 0.35; cursor: not-allowed; }

    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--surface); border: 1px solid var(--border-hi);
      border-radius: 6px; padding: 11px 20px;
      font-size: 12px; font-weight: 500; color: var(--text);
      opacity: 0; pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      white-space: nowrap; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(192,80,74,0.5); color: #e07070; }
  </style>
</head>

// ─────────────────────────────────────────────
// LOGO LOADER
// ─────────────────────────────────────────────
let _logoCache = null;
async function getLogo() {
  if (_logoCache) return _logoCache;
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const d = ctx.getImageData(0, 0, cv.width, cv.height);
      for (let i = 0; i < d.data.length; i += 4) {
        if (d.data[i+3] > 0) {
          d.data[i] = 255-d.data[i]; d.data[i+1] = 255-d.data[i+1]; d.data[i+2] = 255-d.data[i+2];
        }
      }
      ctx.putImageData(d, 0, 0);
      _logoCache = cv.toDataURL('image/png');
      resolve(_logoCache);
    };
    img.onerror = () => resolve(null);
    img.src = '../../logos/logotrascendencia.png';
  });
}

// ─────────────────────────────────────────────
// COLLECT DATA
// ─────────────────────────────────────────────
function collectData() {
  const required = ['evento','ciudad','fecha_dia1','fecha_dia2','fecha_dia3','hora_inicio'];
  const data = {};
  let valid = true;

  required.forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('invalid');
    if (!el.value.trim()) { el.classList.add('invalid'); valid = false; }
    data[id] = el.value.trim();
  });

  ['n_parejas','conductor','daychairs','facilitador_conexion',
   'facilitador_filosofico','speaker_internacional','coordinacion_produccion'].forEach(id => {
    data[id] = document.getElementById(id).value.trim();
  });

  return valid ? data : null;
}

// ─────────────────────────────────────────────
// TIME HELPERS
// ─────────────────────────────────────────────
function parseTime(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function formatTime(totalMin) {
  const h = Math.floor(totalMin / 60) % 24;
  const m = totalMin % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function fmtDate(str) {
  if (!str) return '';
  const [y, m, d] = str.split('-');
  const days = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const dt = new Date(Number(y), Number(m)-1, Number(d));
  return `${days[dt.getDay()]} ${parseInt(d)} de ${months[Number(m)-1]} de ${y}`;
}

function roleLabel(key, d) {
  const map = {
    conductor:    d.conductor     || 'Conductor/a del Evento',
    daychairs:    d.daychairs     || 'Daychairs',
    conexion:     d.facilitador_conexion   || 'Fac. de Conexión',
    filosofico:   d.facilitador_filosofico || 'Fac. de Contenido',
    speaker:      d.speaker_internacional  || 'Speaker Internacional',
    coproduccion: d.coordinacion_produccion || 'Co-Coordinación de Producción',
    equipo:       'Equipo',
    '':           '',
  };
  return map[key] || key;
}

// ─────────────────────────────────────────────
// PDF DESIGN CONSTANTS
// ─────────────────────────────────────────────
const W = 215.9, H = 279.4;
const ML = 18, MR = 18, CW = W - ML - MR;
const C_BLACK  = [10, 10, 10];
const C_TEXT   = [30, 30, 30];
const C_MUTED  = [120, 120, 120];
const C_LIGHT  = [185, 185, 185];
const C_RULE   = [218, 216, 212];
const C_WHITE  = [255, 255, 255];
const C_ALTROW = [249, 248, 246];
const C_DAYBAND = [24, 24, 24]; // slightly lighter than black for day header

function addPageHeader(doc, logo, d, dayLabel, dayDate) {
  // Full black band
  doc.setFillColor(...C_BLACK);
  doc.rect(0, 0, W, 24, 'F');

  // Logo left-center
  if (logo) {
    const lw = 52, lh = lw / 8.646;
    doc.addImage(logo, 'PNG', ML, (24 - lh) / 2, lw, lh);
  }

  // Event name + city right
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7);
  doc.setTextColor(...C_LIGHT);
  doc.text(d.evento, W - MR, 9.5, { align: 'right' });
  doc.setFontSize(6.5);
  doc.setTextColor(90, 90, 90);
  doc.text(d.ciudad, W - MR, 14, { align: 'right' });

  // Separator
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.25);
  doc.line(0, 24, W, 24);

  // Day header band
  doc.setFillColor(...C_DAYBAND);
  doc.rect(0, 24, W, 14, 'F');

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(9);
  doc.setTextColor(...C_WHITE);
  doc.text(dayLabel, ML, 33);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.5);
  doc.setTextColor(...C_LIGHT);
  doc.text(fmtDate(dayDate), W - MR, 33, { align: 'right' });

  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.25);
  doc.line(0, 38, W, 38);
}

function addPageFooter(doc, d, pageNum, totalPages) {
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.25);
  doc.line(ML, H - 14, W - MR, H - 14);

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(5.5);
  doc.setTextColor(...C_MUTED);
  doc.text('TRASCENDENCIA', ML, H - 9, { charSpace: 1.6 });

  doc.setFont('helvetica', 'normal');
  doc.text('Documento interno · uso exclusivo del equipo', W / 2, H - 9, { align: 'center' });

  doc.setTextColor(...C_LIGHT);
  doc.text(`${pageNum} / ${totalPages}`, W - MR, H - 9, { align: 'right' });
}

// ─────────────────────────────────────────────
// RENDER ONE DAY
// ─────────────────────────────────────────────
function renderDay(doc, logo, d, dayNum, items, startHhmm, version) {
  if (dayNum > 1) doc.addPage();

  const dayLabels = ['DÍA 1 · LLEGADA Y APERTURA', 'DÍA 2 · TALLER PRINCIPAL', 'DÍA 3 · FILMACIONES Y CIERRE'];
  const dayDates  = [d.fecha_dia1, d.fecha_dia2, d.fecha_dia3];

  addPageHeader(doc, logo, d, dayLabels[dayNum - 1], dayDates[dayNum - 1]);

  let currentMin = parseTime(startHhmm);
  if (dayNum === 2) currentMin = parseTime('08:00');
  if (dayNum === 3) currentMin = parseTime('08:00');

  let y = 44;
  const colTime  = ML;
  const colAct   = ML + 22;
  const colRole  = ML + 100;
  const colNotes = ML + 142;
  const actW     = 74;
  const roleW    = 38;
  const notesW   = CW - 142;

  // Column headers
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(6.5);
  doc.setTextColor(...C_MUTED);
  doc.text('HORA', colTime, y, { charSpace: 0.8 });
  doc.text('ACTIVIDAD', colAct, y, { charSpace: 0.8 });
  if (version === 'equipo') {
    doc.text('ROL', colRole, y, { charSpace: 0.8 });
    doc.text('NOTAS', colNotes, y, { charSpace: 0.8 });
  }
  y += 3;
  doc.setDrawColor(...C_RULE);
  doc.setLineWidth(0.25);
  doc.line(ML, y, W - MR, y);
  y += 4;

  let rowAlt = false;

  items.forEach(([dur, act, roleKey, notes, internalOnly]) => {
    if (version === 'participantes' && internalOnly) return;

    // Row background
    if (rowAlt) {
      doc.setFillColor(...C_ALTROW);
      const linesAct = doc.setFontSize(8.5) && doc.splitTextToSize(act, version === 'equipo' ? actW : CW - 22);
      doc.setFontSize(8.5);
      const actLines = doc.splitTextToSize(act, version === 'equipo' ? actW : CW - 22);
      const rowH = Math.max(actLines.length * 4.8, 8);
      doc.rect(ML - 1, y - 3.5, CW + 2, rowH + 2, 'F');
    }
    rowAlt = !rowAlt;

    // Time
    const timeStr = dur === 0 ? '·' : formatTime(currentMin);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.5);
    doc.setTextColor(...C_MUTED);
    doc.text(timeStr, colTime, y);

    // Duration badge (small)
    if (dur > 0 && version === 'equipo') {
      doc.setFontSize(6);
      doc.setTextColor(...C_LIGHT);
      doc.text(`${dur} min`, colTime, y + 4.5);
    }

    // Activity
    doc.setFont('helvetica', dur >= 45 ? 'bold' : 'normal');
    doc.setFontSize(8.5);
    doc.setTextColor(...C_TEXT);
    const actW2 = version === 'equipo' ? actW : CW - 22;
    const actLines = doc.splitTextToSize(act, actW2);
    doc.text(actLines, colAct, y);

    if (version === 'equipo') {
      // Role
      if (roleKey) {
        const roleText = roleLabel(roleKey, d);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7);
        doc.setTextColor(...C_MUTED);
        const roleLines = doc.splitTextToSize(roleText, roleW);
        doc.text(roleLines, colRole, y);
      }

      // Notes
      if (notes) {
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(6.5);
        doc.setTextColor(...C_LIGHT);
        const notesLines = doc.splitTextToSize(notes, notesW);
        doc.text(notesLines, colNotes, y);
      }
    }

    const rowH = Math.max(actLines.length * 4.8, 8);
    y += rowH + 3.5;
    if (dur > 0) currentMin += dur;

    // Check for page overflow
    if (y > H - 22) {
      doc.addPage();
      addPageHeader(doc, logo, d, `${dayLabels[dayNum - 1]} (cont.)`, dayDates[dayNum - 1]);
      y = 44;
      rowAlt = false;
    }
  });

  return currentMin; // return end time
}

// ─────────────────────────────────────────────
// MAIN GENERATOR
// ─────────────────────────────────────────────
async function generatePDF(d, version) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ format: 'letter', unit: 'mm' });
  const logo = await getLogo();

  // Render 3 days
  renderDay(doc, logo, d, 1, DIA1, d.hora_inicio, version);
  renderDay(doc, logo, d, 2, DIA2, '08:00', version);
  renderDay(doc, logo, d, 3, DIA3, '08:00', version);

  // Add footers to all pages
  const totalPages = doc.internal.getNumberOfPages();
  for (let p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    addPageFooter(doc, d, p, totalPages);
  }

  const vLabel = version === 'equipo' ? 'Equipo' : 'Participantes';
  doc.save(`Agenda_${vLabel}_${d.evento.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.pdf`);
}

// ─────────────────────────────────────────────
// TOAST + INIT
// ─────────────────────────────────────────────
function showToast(msg, kind = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${kind} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

document.getElementById('btn-generate').addEventListener('click', async () => {
  const data = collectData();
  if (!data) { showToast('Completa los campos requeridos', 'error'); return; }

  const btn = document.getElementById('btn-generate');
  btn.disabled = true;
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Generando…`;

  try {
    await generatePDF(data, currentVersion);
    showToast('Agenda generada correctamente');
  } catch (e) {
    showToast('Error al generar', 'error');
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Generar Agenda PDF`;
  }
});
</script>
